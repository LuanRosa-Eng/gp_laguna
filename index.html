<html lang="pt-BR">

<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f4f0;--panel:rgba(10,14,20,.86);--red:#e63b2e;--gold:#ffbe0b;--cyan:#00e5ff;--green:#4ade80;color-scheme:dark}
html,body{height:100%;margin:0;background:#1a2634;overflow:hidden;font:500 14px Barlow,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{position:fixed;background:var(--panel);border-radius:12px;padding:10px 14px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 28px rgba(0,0,0,.42)}
#hud{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);line-height:1.25;min-width:242px}
#hud b{font:800 32px/1 'Saira Condensed',sans-serif;display:block;letter-spacing:.5px}
#hud small{opacity:.88;display:block;font-size:12.5px}
.bar-wrap{width:100%;height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin:4px 0}
#nitroBar{height:100%;width:100%;background:linear-gradient(90deg,#00b4d8,#00f5d4)}
#rpmBar{height:100%;width:20%;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}
#hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#facc15,#4ade80)}
.hb-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:var(--red);color:#fff;font:800 11px 'Saira Condensed',sans-serif;letter-spacing:.5px}
.bo-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:var(--gold);color:#111;font:800 11px 'Saira Condensed',sans-serif;letter-spacing:.5px}

#scoreBox{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);text-align:center;min-width:248px;padding:8px 18px}
#pts{font:800 30px/1 'Saira Condensed',sans-serif;color:var(--gold);display:block}
#subPts{font:700 13px Barlow,sans-serif;letter-spacing:.6px;text-transform:uppercase;opacity:.92}
#driftLive{font:800 22px/1.1 'Saira Condensed',sans-serif;color:var(--cyan);margin-top:4px;min-height:24px;text-shadow:0 0 12px rgba(0,229,255,.55)}

#mm{right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:4px}
#set{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:275px;display:none;max-height:66vh;overflow-y:auto;z-index:15}
#set label{display:grid;grid-template-columns:1fr 54px;font-size:12.5px;margin:6px 0 0}
#set input{grid-column:1/3;width:100%;accent-color:var(--red)}
#flipBtn{width:100%;margin-top:10px;padding:6px 10px;font-size:15px;background:rgba(255,255,255,.15)}

#msg{position:fixed;left:0;right:0;top:22%;text-align:center;font:800 min(18vmin,120px)/1 'Saira Condensed',sans-serif;text-shadow:0 6px 24px rgba(0,0,0,.78);pointer-events:none;z-index:12;letter-spacing:1px}
#msgSub{position:fixed;left:0;right:0;top:37%;text-align:center;font:800 min(5.5vmin,34px)/1 'Saira Condensed',sans-serif;color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.85);pointer-events:none;z-index:12}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,18,.62);backdrop-filter:blur(6px);z-index:25}
#ov .p{position:static;max-width:490px;text-align:center;padding:22px 26px}
#ov h1{margin:0 0 4px;font:800 44px/1 'Saira Condensed',sans-serif;color:var(--red);text-transform:uppercase}
#ov p{margin:6px 0 12px;font-size:14px;line-height:1.45;opacity:.92}
.sec-lbl{font:800 13px 'Saira Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-top:8px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
button{font:800 18px 'Saira Condensed',sans-serif;background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 20px;cursor:pointer;transition:transform .1s,filter .15s;letter-spacing:.5px}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.96)}
.row button{background:rgba(255,255,255,.14);padding:6px 13px}.row button.sel{background:var(--red)}

const TRACKS=[

    barriers:[[0.00,0.13,0],[0.14,0.23,-1],[0.36,0.48,1],[0.58,0.68,-1],[0.85,1.00,0]]
  },
  {
    name:'Arena Zoeira (Curta)',
    W:18,LT:940,LAPS:5,sub:16,fullWalls:true,
    P0:[
      [0,-65,0],[55,-65,0],[95,-42,0],[105,0,0],[85,42,0],[42,48,0],
      [0,0,0],
      [-42,-48,0],[-85,-42,0],[-105,0,0],[-95,42,0],[-55,65,0],
      [0,65,0],[55,65,0],[95,42,0],[105,0,0],[85,-42,0],[42,-48,0],
      [0,0,0],
      [-42,48,0],[-85,42,0],[-105,0,0],[-95,-42,0],[-55,-65,0]
    ],
    barriers:[[0.00,1.00,0]]
  }
];

/* =====================================================================
   2. RENDERIZADOR PBR, ILUMINAÇÃO CINEMATOGRÁFICA E TEXTURAS PROCEDURAIS
   ===================================================================== */
const ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio,1.5));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.toneMapping=THREE.ACESFilmicToneMapping;
ren.toneMappingExposure=1.12;

const sc=new THREE.Scene();
sc.background=new THREE.Color(0x88bfe6);
sc.fog=new THREE.FogExp2(0x9ac6e6,0.00062);

const cam=new THREE.PerspectiveCamera(65,1,.3,3600);

const sun=new THREE.DirectionalLight(0xffdfb0,1.45);
sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
sun.shadow.bias=-0.0004;
{const q=sun.shadow.camera;q.left=q.bottom=-52;q.right=q.top=52;q.near=1;q.far=300}

const fireLight=new THREE.PointLight(0xff5500,0,32);

/* Céu atmosférico Golden Hour + Disco Solar + Nuvens volumétricas */
{

  eg.rotation.x=-Math.PI/2;eg.position.y=-3;envSc.add(eg);
  const es=new THREE.Mesh(new THREE.SphereGeometry(12,8,8),new THREE.MeshBasicMaterial({color:0xfff2cc}));
  es.position.set(35,28,22);envSc.add(es);
  sc.environment=pmrem.fromScene(envSc).texture;
}

/* Camada de Nuvens 3D no horizonte */
{
  const cloudCount=90;
  const cGeo=new THREE.DodecahedronGeometry(1,1);
  const cMat=new THREE.MeshLambertMaterial({color:0xfff7eb,transparent:true,opacity:0.84,fog:true});
  const clouds=new THREE.InstancedMesh(cGeo,cMat,cloudCount);
  const d=new THREE.Object3D();
  for(let i=0;i<cloudCount;i++){
    const ang=(i/cloudCount)*Math.PI*2+(i%5)*0.15;
    const rad=450+(i*137)%1400;
    d.position.set(Math.cos(ang)*rad,210+(i*29)%110,Math.sin(ang)*rad);
    d.rotation.set(0,ang,0);
    d.scale.set(55+(i*19)%75,14+(i*7)%12,35+(i*23)%45);
    d.updateMatrix();
    clouds.setMatrixAt(i,d.matrix);
  }
  sc.add(clouds);
}

function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

/* Texturas PBR Procedurais: Albedo + Bump + Roughness para Asfalto e Terreno */
function makeAsphaltTextures(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=512;
  const ctx=cv.getContext('2d');
  const bmp=document.createElement('canvas');bmp.width=512;bmp.height=512;
  const btx=bmp.getContext('2d');

  ctx.fillStyle='#282b30';ctx.fillRect(0,0,512,512);
  btx.fillStyle='#808080';btx.fillRect(0,0,512,512);

  /* Granulação mineral realista */
  for(let i=0;i<28000;i++){
    const x=Math.random()*512,y=Math.random()*512;
    const v=26+Math.floor(Math.random()*36);
    ctx.fillStyle=`rgb(${v},${v},${v+2})`;
    ctx.fillRect(x,y,2,2);
    const bv=90+Math.floor(Math.random()*85);
    btx.fillStyle=`rgb(${bv},${bv},${bv})`;
    btx.fillRect(x,y,2,2);
  }

  /* Trilho emborrachado e desgaste longitudinal */
  const g=ctx.createLinearGradient(0,0,512,0);
  g.addColorStop(0.00,'rgba(0,0,0,0.18)');
  g.addColorStop(0.12,'rgba(0,0,0,0.02)');
  g.addColorStop(0.30,'rgba(8,8,10,0.28)');
  g.addColorStop(0.50,'rgba(0,0,0,0.06)');
  g.addColorStop(0.70,'rgba(8,8,10,0.28)');
  g.addColorStop(0.88,'rgba(0,0,0,0.02)');
  g.addColorStop(1.00,'rgba(0,0,0,0.18)');
  ctx.fillStyle=g;ctx.fillRect(0,0,512,512);

  /* Remendos de piche sutis */
  ctx.strokeStyle='rgba(15,16,18,0.45)';ctx.lineWidth=2;
  for(let k=0;k<4;k++){
    ctx.beginPath();
    let sx=80+Math.random()*350,sy=Math.random()*512;
    ctx.moveTo(sx,sy);
    for(let s=0;s<6;s++){sx+=(Math.random()-.5)*45;sy+=85;ctx.lineTo(sx,sy)}
    ctx.stroke();
  }

  /* Linha tracejada central da pista */
  ctx.fillStyle='rgba(235,235,230,0.38)';
  ctx.fillRect(253,32,6,180);
  ctx.fillRect(253,290,6,180);

  const map=new THREE.CanvasTexture(cv);
  const bump=new THREE.CanvasTexture(bmp);
  map.wrapS=map.wrapT=bump.wrapS=bump.wrapT=THREE.RepeatWrapping;
  map.anisotropy=bump.anisotropy=4;
  return{map,bump};
}
const asphaltTex=makeAsphaltTextures();

function makeTerrainBump(){
  const cv=document.createElement('canvas');cv.width=256;cv.height=256;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#808080';ctx.fillRect(0,0,256,256);
  for(let i=0;i<14000;i++){
    const v=75+Math.floor(Math.random()*105);
    ctx.fillStyle=`rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random()*256,Math.random()*256,3,3);
  }
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(60,60);
  return t;
}
const terrainBump=makeTerrainBump();

/* =====================================================================
   3. CONSTRUTOR DE PISTA, MURETAS, ARQUIBANCADAS, BOXES E FLORESTA
   ===================================================================== */
let trackIdx=0,W=15,LT=3602,LAPS=3,NP=0;
let pts=[],tg=[],nr=[],wallMask=[];
const trackGroup=new THREE.Group();
sc.add(trackGroup);

function hasWallAt(idx,sd){
  const mask=wallMask[idx]||0;
  return sd<0?(mask&1)!==0:(mask&2)!==0;
}

function buildTrack(idx){
  trackIdx=idx;
  const trk=TRACKS[idx];
  W=trk.W;LT=trk.LT;LAPS=trk.LAPS;
  while(trackGroup.children.length)trackGroup.remove(trackGroup.children[0]);
  pts=[];tg=[];nr=[];wallMask=[];

  const P=trk.P0.map(p=>new THREE.Vector3(p[0],p[2],-p[1])),n=P.length;
  const cr=(a,b,c,d,t)=>.5*(2*b+(c-a)*t+(2*a-5*b+4*c-d)*t*t+(3*b-a-3*c+d)*t*t*t);
  for(let i=0;i<n;i++){
    const a=P[(i+n-1)%n],b=P[i],c=P[(i+1)%n],d=P[(i+2)%n];
    for(let s=0;s<trk.sub;s++){
      const t=s/trk.sub;
      pts.push(new THREE.Vector3(cr(a.x,b.x,c.x,d.x,t),cr(a.y,b.y,c.y,d.y,t),cr(a.z,b.z,c.z,d.z,t)));
    }
  }
  NP=pts.length;
  let L=0;
  for(let i=0;i<NP;i++)L+=Math.hypot(pts[(i+1)%NP].x-pts[i].x,pts[(i+1)%NP].z-pts[i].z);
  const k=LT/L;
  pts.forEach(p=>{p.x*=k;p.z*=k});
  for(let i=0;i<NP;i++){
    const t=new THREE.Vector3(pts[(i+1)%NP].x-pts[(i+NP-1)%NP].x,0,pts[(i+1)%NP].z-pts[(i+NP-1)%NP].z).normalize();
    tg.push(t);
    nr.push(new THREE.Vector3(-t.z,0,t.x));
    wallMask.push(0);
  }

  trk.barriers.forEach(b=>{
    const i0=Math.floor(b[0]*NP),i1=Math.ceil(b[1]*NP);
    for(let i=i0;i<i1;i++){
      const ii=i%NP;
      if(b[2]<=0)wallMask[ii]|=1;
      if(b[2]>=0)wallMask[ii]|=2;
    }
  });
  if(trk.fullWalls){
    for(let i=0;i<NP;i++){
      if(Math.hypot(pts[i].x,pts[i].z)<W*1.35)wallMask[i]=0;
    }
  }

  function strip(pos,col,uv,o1,o2,y,f){
    for(let i=0;i<NP;i++){
      const j=(i+1)%NP,c=f(i),A=pts[i],B=pts[j],a=nr[i],b=nr[j];
      const v=[[A.x+a.x*o1,A.y+y,A.z+a.z*o1],[A.x+a.x*o2,A.y+y,A.z+a.z*o2],[B.x+b.x*o1,B.y+y,B.z+b.z*o1],[B.x+b.x*o2,B.y+y,B.z+b.z*o2]];
      const uvs=[[0,i*.45],[1,i*.45],[0,(i+1)*.45],[1,(i+1)*.45]];
      for(const q of [0,1,2,1,3,2]){pos.push(...v[q]);col.push(c.r,c.g,c.b);uv.push(...uvs[q])}
    }
  }
  function talude(pos,col,uv,sd){
    const gc=new THREE.Color(.28,.41,.17);
    for(let i=0;i<NP;i++){
      const j=(i+1)%NP,q=[];
      for(const s of [i,j]){const A=pts[s],o=sd*(W/2+11),e=sd*(W/2+11+(A.y+15)*1.35);q.push([A.x+nr[s].x*o,A.y,A.z+nr[s].z*o],[A.x+nr[s].x*e,-15,A.z+nr[s].z*e])}
      for(const qk of [0,1,2,1,3,2]){pos.push(...q[qk]);col.push(gc.r,gc.g,gc.b);uv.push(0,0)}
    }
  }

  const pos=[],col=[],uv=[],h=W/2,C=(r,g,b)=>new THREE.Color(r,g,b);
  strip(pos,col,uv,-h,h,0,()=>C(.95,.95,.98));
  const gRoad=new THREE.BufferGeometry();
  gRoad.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  gRoad.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  gRoad.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  gRoad.computeVertexNormals();
  const mRoad=new THREE.Mesh(gRoad,new THREE.MeshStandardMaterial({
    map:asphaltTex.map,bumpMap:asphaltTex.bump,bumpScale:0.035,
    vertexColors:true,roughness:.76,metalness:.08
  }));
  mRoad.receiveShadow=true;trackGroup.add(mRoad);

  const p2=[],c2=[],u2=[];
  for(const sd of [-1,1]){
    strip(p2,c2,u2,sd*(h-.5),sd*(h-.18),.02,()=>C(.96,.96,.96));
    strip(p2,c2,u2,sd*h,sd*(h+1.3),.035,i=>(i>>1)%2?C(.96,.96,.96):C(.88,.14,.12));
    strip(p2,c2,u2,sd*(h+1.3),sd*(h+11),-.02,i=>i%3===0?C(.36,.48,.21):C(.29,.44,.18));
    talude(p2,c2,u2,sd);
  }
  const gEdge=new THREE.BufferGeometry();
  gEdge.setAttribute('position',new THREE.Float32BufferAttribute(p2,3));
  gEdge.setAttribute('color',new THREE.Float32BufferAttribute(c2,3));
  gEdge.setAttribute('uv',new THREE.Float32BufferAttribute(u2,2));
  gEdge.computeVertexNormals();
  const mEdge=new THREE.Mesh(gEdge,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92,side:THREE.DoubleSide}));
  mEdge.receiveShadow=true;trackGroup.add(mEdge);

  /* Muretas de concreto 3D + Guard-rail metálico superior */
  const wPos=[],wCol=[];
  for(const sd of [-1,1]){
    const oIn=sd*(h+1.35),oOut=sd*(h+2.1),wH=1.22;
    for(let i=0;i<NP;i++){
      if(!hasWallAt(i,sd))continue;
      const j=(i+1)%NP,A=pts[i],B=pts[j],a=nr[i],b=nr[j];
      const cSide=(i%2===0)?C(.84,.85,.87):C(.75,.77,.79);
      const cStripe=(i%2===0)?C(.88,.16,.14):C(.96,.96,.96);
      const p00=[A.x+a.x*oIn,A.y,A.z+a.z*oIn],p10=[B.x+b.x*oIn,B.y,B.z+b.z*oIn];
      const p01=[A.x+a.x*oIn,A.y+wH,A.z+a.z*oIn],p11=[B.x+b.x*oIn,B.y+wH,B.z+b.z*oIn];
      const q01=[A.x+a.x*oOut,A.y+wH,A.z+a.z*oOut],q11=[B.x+b.x*oOut,B.y+wH,B.z+b.z*oOut];
      const q00=[A.x+a.x*oOut,A.y,A.z+a.z*oOut],q10=[B.x+b.x*oOut,B.y,B.z+b.z*oOut];
      const quads=[
        [p00,p10,p01,p11,cSide],
        [p01,p11,q01,q11,cStripe],
        [q10,q00,q11,q01,cSide]
      ];
      quads.forEach(qd=>{
        const idxOrder=sd>0?[0,1,2,1,3,2]:[0,2,1,1,2,3];
        idxOrder.forEach(vi=>{wPos.push(...qd[vi]);wCol.push(qd[4].r,qd[4].g,qd[4].b)});
      });
    }
  }
  if(wPos.length){
    const gWall=new THREE.BufferGeometry();
    gWall.setAttribute('position',new THREE.Float32BufferAttribute(wPos,3));
    gWall.setAttribute('color',new THREE.Float32BufferAttribute(wCol,3));
    gWall.computeVertexNormals();
    const mWall=new THREE.Mesh(gWall,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.62,metalness:.12,side:THREE.DoubleSide}));
    mWall.castShadow=true;mWall.receiveShadow=true;
    trackGroup.add(mWall);
  }

  /* Pórtico de Largada Detalhado + Semáforo + Grid no Asfalto */
  const gg=new THREE.Group();
  gg.position.copy(pts[0]);gg.rotation.y=Math.atan2(tg[0].x,tg[0].z);trackGroup.add(gg);
  const redMat=new THREE.MeshStandardMaterial({color:0xd9261c,roughness:.35,metalness:.3});
  const steelMat=new THREE.MeshStandardMaterial({color:0x2b3038,roughness:.4,metalness:.7});
  for(const p of [[-h-1.6,4.0,.7,8],[h+1.6,4.0,.7,8],[0,8.1,W+4.6,1.35]]){
    const b=new THREE.Mesh(new THREE.BoxGeometry(p[2],p[3],.85),redMat);b.position.set(p[0],p[1],0);b.castShadow=true;gg.add(b);
  }
  const bannerMesh=new THREE.Mesh(new THREE.BoxGeometry(W+2,1.1,.92),new THREE.MeshStandardMaterial({color:0x11151c,roughness:.4}));
  bannerMesh.position.set(0,8.1,0);gg.add(bannerMesh);
  for(let lx=-4;lx<=4;lx+=2){
    const lamp=new THREE.Mesh(new THREE.BoxGeometry(.55,.35,.96),new THREE.MeshBasicMaterial({color:0xff2a1f}));
    lamp.position.set(lx,7.2,0);gg.add(lamp);
  }
  /* Faixa quadriculada de largada no asfalto */
  const lineMesh=new THREE.Mesh(new THREE.PlaneGeometry(W,1.4),new THREE.MeshStandardMaterial({color:0xf4f4f0,roughness:.7}));
  lineMesh.rotation.x=-Math.PI/2;lineMesh.position.y=0.04;gg.add(lineMesh);

  /* Arquibancadas (Grandstands) e Prédio dos Boxes na Reta Principal */
  {
    const standGroup=new THREE.Group();
    const sIdx=Math.floor(NP*0.96);
    standGroup.position.copy(pts[sIdx]);
    standGroup.rotation.y=Math.atan2(tg[sIdx].x,tg[sIdx].z);
    trackGroup.add(standGroup);

    /* Arquibancada lado externo */
    const concMat=new THREE.MeshStandardMaterial({color:0x9aa0a8,roughness:.8});
    const roofMat=new THREE.MeshStandardMaterial({color:0xd9261c,roughness:.4,metalness:.25});
    for(let tier=0;tier<5;tier++){
      const step=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.65,64),concMat);
      step.position.set(h+5.5+tier*1.3,0.4+tier*0.65,0);
      step.castShadow=true;step.receiveShadow=true;
      standGroup.add(step);
    }
    const roof=new THREE.Mesh(new THREE.BoxGeometry(8.5,0.35,66),roofMat);
    roof.position.set(h+8.5,5.6,0);roof.rotation.z=-0.12;roof.castShadow=true;
    standGroup.add(roof);
    for(let pz=-30;pz<=30;pz+=15){
      const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,5.6,8),steelMat);
      pil.position.set(h+11.5,2.8,pz);standGroup.add(pil);
    }

    /* Prédio dos Boxes e Torre de Controle do lado oposto */
    if(!trk.fullWalls){
      const pitBldg=new THREE.Mesh(new THREE.BoxGeometry(8,4.6,56),new THREE.MeshStandardMaterial({color:0xeaeaea,roughness:.6}));
      pitBldg.position.set(-h-8.5,2.3,0);pitBldg.castShadow=true;pitBldg.receiveShadow=true;
      standGroup.add(pitBldg);
      const pitTrim=new THREE.Mesh(new THREE.BoxGeometry(8.3,0.7,56.3),redMat);
      pitTrim.position.set(-h-8.5,4.4,0);standGroup.add(pitTrim);
      for(let gz=-22;gz<=22;gz+=7.3){
        const door=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.7,4.5),steelMat);
        door.position.set(-h-4.45,1.35,gz);standGroup.add(door);
      }
      const tower=new THREE.Mesh(new THREE.BoxGeometry(5.5,11,6.5),new THREE.MeshStandardMaterial({color:0x222831,roughness:.3,metalness:.5}));
      tower.position.set(-h-8.5,5.5,-32);tower.castShadow=true;standGroup.add(tower);
    }
  }

  /* Barreiras de Pneus (Tire Walls) nas saídas de curva + Postes de Luz */
  {
    const tirePositions=[];
    for(let i=8;i<NP-8;i+=3){
      const turn=Math.acos(cl(tg[i].dot(tg[(i+6)%NP]),-1,1));
      if(turn>0.22){
        const cross=tg[i].x*tg[(i+6)%NP].z-tg[i].z*tg[(i+6)%NP].x;
        const outSd=cross>0?-1:1;
        for(let sub=-1;sub<=1;sub++){
          const ii=(i+sub+NP)%NP;
          tirePositions.push({
            x:pts[ii].x+nr[ii].x*outSd*(h+2.8),
            y:pts[ii].y,
            z:pts[ii].z+nr[ii].z*outSd*(h+2.8),
            rot:Math.atan2(tg[ii].x,tg[ii].z),
            red:Math.abs(sub)%2===0
          });
        }
      }
    }
    if(tirePositions.length){
      const tGeo=new THREE.CylinderGeometry(0.55,0.55,1.15,12);
      const tMesh=new THREE.InstancedMesh(tGeo,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7}),tirePositions.length);
      const d=new THREE.Object3D(),cTmp=new THREE.Color();
      tirePositions.forEach((tp,idx)=>{
        d.position.set(tp.x,tp.y+0.57,tp.z);
        d.rotation.set(0,tp.rot,0);
        d.updateMatrix();
        tMesh.setMatrixAt(idx,d.matrix);
        cTmp.setHex(tp.red?0xd9261c:0xf4f4f0);
        tMesh.setColorAt(idx,cTmp);
      });
      tMesh.castShadow=true;tMesh.receiveShadow=true;
      if(tMesh.instanceColor)tMesh.instanceColor.needsUpdate=true;
      trackGroup.add(tMesh);
    }

    /* Postes de Iluminação ao longo da pista */
    const poleStep=trk.fullWalls?14:22;
    const poleCount=Math.floor(NP/poleStep);
    const pMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12,0.2,9.5,6),steelMat,poleCount);
    const lMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1.4,0.22,0.5),new THREE.MeshBasicMaterial({color:0xfff3d1}),poleCount);
    const d=new THREE.Object3D();
    for(let k=0;k<poleCount;k++){
      const i=(k*poleStep)%NP,sd=k%2===0?1:-1;
      const px=pts[i].x+nr[i].x*sd*(h+3.2),pz=pts[i].z+nr[i].z*sd*(h+3.2),py=pts[i].y;
      const yaw=Math.atan2(nr[i].x*sd,nr[i].z*sd);
      d.position.set(px,py+4.75,pz);d.rotation.set(0,yaw,0);d.updateMatrix();
      pMesh.setMatrixAt(k,d.matrix);
      d.position.set(px-nr[i].x*sd*0.6,py+9.4,pz-nr[i].z*sd*0.6);d.updateMatrix();
      lMesh.setMatrixAt(k,d.matrix);
    }
    trackGroup.add(pMesh,lMesh);
  }

  /* Terreno Montanhoso Esculpido com Textura de Relevo e Gradiente Rochoso */
  const gGeo=new THREE.PlaneGeometry(4200,4200,96,96);
  gGeo.rotateX(-Math.PI/2);
  const gPos=gGeo.attributes.position,gCol=[];
  for(let i=0;i<gPos.count;i++){
    const vx=gPos.getX(i),vz=gPos.getZ(i);
    let minD=1e9;
    for(let k=0;k<NP;k+=3){
      const d=Math.hypot(vx-pts[k].x,vz-pts[k].z);
      if(d<minD)minD=d;
    }
    const hillFactor=cl((minD-60)/280,0,1);
    const ridge1=Math.sin(vx*0.0038)*Math.cos(vz*0.0038)*0.5+0.5;
    const ridge2=Math.sin(vx*0.0105+vz*0.0085)*0.5+0.5;
    const ridge3=Math.cos(vx*0.022-vz*0.019)*0.5+0.5;
    const elev=hillFactor*(ridge1*88+ridge2*28+ridge3*8);
    const vy=-15.1+elev;
    gPos.setY(i,vy);

    /* Mistura realista: grama verde no vale, dourado californiano na encosta, rocha cinza no topo */
    const rockMix=cl((elev-42)/45,0,1);
    const dryMix=cl((elev-10)/35,0,1)*(1-rockMix);
    const tone=0.86+0.25*Math.sin(vx*0.018)*Math.cos(vz*0.018);
    const rCol=(0.23*(1-dryMix-rockMix)+0.46*dryMix+0.44*rockMix)*tone;
    const gColV=(0.39*(1-dryMix-rockMix)+0.42*dryMix+0.42*rockMix)*tone;
    const bCol=(0.16*(1-dryMix-rockMix)+0.21*dryMix+0.39*rockMix)*tone;
    gCol.push(rCol,gColV,bCol);
  }
  gGeo.setAttribute('color',new THREE.Float32BufferAttribute(gCol,3));
  gGeo.computeVertexNormals();
  const gr=new THREE.Mesh(gGeo,new THREE.MeshStandardMaterial({
    vertexColors:true,bumpMap:terrainBump,bumpScale:0.35,roughness:.95,metalness:0
  }));
  gr.receiveShadow=true;
  trackGroup.add(gr);

  /* Floresta Realista Multi-Camadas + Rochas + Arbustos */
  const N_PINE=1500,N_OAK=1200,N_ROCK=450;
  const trunkMat=new THREE.MeshStandardMaterial({color:0x47301d,roughness:.92});
  const pineMat1=new THREE.MeshStandardMaterial({color:0x1b4525,roughness:.85});
  const pineMat2=new THREE.MeshStandardMaterial({color:0x275e34,roughness:.82});
  const pineMat3=new THREE.MeshStandardMaterial({color:0x327341,roughness:.80});
  const oakMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.84});
  const rockMat=new THREE.MeshStandardMaterial({color:0x6d6b66,roughness:.92});

  const mTrunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.25,.52,4.0,7),trunkMat,N_PINE+N_OAK);
  const mPine1=new THREE.InstancedMesh(new THREE.ConeGeometry(3.4,5.8,8),pineMat1,N_PINE);
  const mPine2=new THREE.InstancedMesh(new THREE.ConeGeometry(2.6,5.2,8),pineMat2,N_PINE);
  const mPine3=new THREE.InstancedMesh(new THREE.ConeGeometry(1.7,4.4,8),pineMat3,N_PINE);
  const mOak1=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(3.1,1),oakMat,N_OAK);
  const mOak2=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(2.3,1),oakMat,N_OAK);
  const mRock=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1.8,0),rockMat,N_ROCK);

  const dummy=new THREE.Object3D(),colTmp=new THREE.Color();
  const oakPalette=[0x296137,0x346e1c,0x457328,0x557c2e,0x6a8722,0x7d7226];
  let sd=41;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

  function sampleNatureSpot(maxDist=340){
    for(let tries=0;tries<16;tries++){
      const i=Math.floor(rnd()*NP),s=rnd()<.5?-1:1;
      const dist=h+13.5+Math.pow(rnd(),1.3)*maxDist;
      const fx=pts[i].x+nr[i].x*s*dist,fz=pts[i].z+nr[i].z*s*dist;
      let ok=true;
      for(let k=0;k<NP;k+=3){
        if(Math.hypot(fx-pts[k].x,fz-pts[k].z)<h+13.2){ok=false;break}
      }
      if(!ok)continue;
      const hillFactor=cl((dist-50)/280,0,1);
      const ridge1=Math.sin(fx*0.0038)*Math.cos(fz*0.0038)*0.5+0.5;
      const ridge2=Math.sin(fx*0.0105+fz*0.0085)*0.5+0.5;
      const ridge3=Math.cos(fx*0.022-fz*0.019)*0.5+0.5;
      const baseNear=pts[i].y-(Math.min(dist,60)-11)/1.35;
      const fy=hillFactor>0?(-15.1+hillFactor*(ridge1*88+ridge2*28+ridge3*8)):baseNear;
      return{x:fx,y:fy,z:fz};
    }
    return{x:0,y:-80,z:0};
  }

  for(let k=0;k<N_PINE;k++){
    const sp=sampleNatureSpot(340),scVal=0.85+rnd()*1.25;
    dummy.rotation.set((rnd()-.5)*.08,rnd()*6.28,(rnd()-.5)*.08);
    dummy.position.set(sp.x,sp.y+1.9*scVal,sp.z);
    dummy.scale.set(scVal,scVal,scVal);
    dummy.updateMatrix();mTrunk.setMatrixAt(k,dummy.matrix);

    dummy.position.set(sp.x,sp.y+4.5*scVal,sp.z);dummy.updateMatrix();mPine1.setMatrixAt(k,dummy.matrix);
    dummy.position.set(sp.x,sp.y+7.2*scVal,sp.z);dummy.updateMatrix();mPine2.setMatrixAt(k,dummy.matrix);
    dummy.position.set(sp.x,sp.y+9.6*scVal,sp.z);dummy.updateMatrix();mPine3.setMatrixAt(k,dummy.matrix);
  }
  for(let k=0;k<N_OAK;k++){
    const sp=sampleNatureSpot(310),scVal=0.8+rnd()*1.15;
    dummy.rotation.set(rnd()*.18,rnd()*6.28,rnd()*.18);
    dummy.position.set(sp.x,sp.y+1.8*scVal,sp.z);
    dummy.scale.set(scVal*1.1,scVal,scVal*1.1);
    dummy.updateMatrix();mTrunk.setMatrixAt(N_PINE+k,dummy.matrix);

    dummy.position.set(sp.x,sp.y+4.8*scVal,sp.z);
    dummy.scale.set(scVal*1.2,scVal*0.9,scVal*1.2);
    dummy.updateMatrix();mOak1.setMatrixAt(k,dummy.matrix);

    dummy.position.set(sp.x+(rnd()-.5)*1.8*scVal,sp.y+5.9*scVal,sp.z+(rnd()-.5)*1.8*scVal);
    dummy.scale.set(scVal*1.05,scVal*0.85,scVal*1.05);
    dummy.updateMatrix();mOak2.setMatrixAt(k,dummy.matrix);

    const hex=oakPalette[Math.floor(rnd()*oakPalette.length)];
    colTmp.setHex(hex);mOak1.setColorAt(k,colTmp);
    colTmp.offsetHSL(0,0.03,0.05);mOak2.setColorAt(k,colTmp);
  }
  for(let k=0;k<N_ROCK;k++){
    const sp=sampleNatureSpot(280),scVal=0.5+rnd()*1.8;
    dummy.rotation.set(rnd()*3,rnd()*3,rnd()*3);
    dummy.position.set(sp.x,sp.y+0.4*scVal,sp.z);
    dummy.scale.set(scVal*1.3,scVal*0.75,scVal);
    dummy.updateMatrix();mRock.setMatrixAt(k,dummy.matrix);
  }
  if(mOak1.instanceColor)mOak1.instanceColor.needsUpdate=true;
  if(mOak2.instanceColor)mOak2.instanceColor.needsUpdate=true;
  trackGroup.add(mTrunk,mPine1,mPine2,mPine3,mOak1,mOak2,mRock);
}

function surf(x,z,h){
  let bi=0,bd=1e12;const lo=h<0?0:h-30,hi=h<0?NP:h+30;
  for(let j=lo;j<hi;j++){const i=(j+NP)%NP,dx=pts[i].x-x,dz=pts[i].z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}
  let best=null;
  for(const i of [(bi+NP-1)%NP,bi]){
    const a=pts[i],b=pts[(i+1)%NP],ex=b.x-a.x,ez=b.z-a.z,t=cl(((x-a.x)*ex+(z-a.z)*ez)/(ex*ex+ez*ez),0,1),
          px=a.x+ex*t,pz=a.z+ez*t,d=Math.hypot(x-px,z-pz);
    if(!best||d<best.d)best={d,i,y:a.y+(b.y-a.y)*t,s:(x-px)*nr[i].x+(z-pz)*nr[i].z};
  }
  return best;
}

   4. SISTEMA DE PARTÍCULAS GPU (FUMAÇA VOLUMÉTRICA, FOGO E FAÍSCAS)
   ===================================================================== */
const MAX_SKIDS=1100;
const skidGeo=new THREE.BufferGeometry();
const skidPos=new Float32Array(MAX_SKIDS*18);
skidGeo.setAttribute('position',new THREE.BufferAttribute(skidPos,3));
const skidMesh=new THREE.Mesh(skidGeo,new THREE.MeshBasicMaterial({color:0x0a0b0d,transparent:true,opacity:0.62,side:THREE.DoubleSide,depthWrite:false}));
skidMesh.frustumCulled=false;
sc.add(skidMesh);
let skidPtr=0;
function addSkid(x1,y1,z1,x2,y2,z2,w=0.30){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  if(len<0.03||len>4)return;
  const nx=-dz/len*(w/2),nz=dx/len*(w/2),o=skidPtr*18;
  const p=[[x1-nx,y1+.035,z1-nz],[x1+nx,y1+.035,z1+nz],[x2-nx,y2+.035,z2-nz],[x2+nx,y2+.035,z2+nz]];
  [0,1,2,1,3,2].forEach((idx,k)=>{skidPos[o+k*3]=p[idx][0];skidPos[o+k*3+1]=p[idx][1];skidPos[o+k*3+2]=p[idx][2]});
  skidPtr=(skidPtr+1)%MAX_SKIDS;
  skidGeo.attributes.position.needsUpdate=true;
}

/* Textura radial suave para nuvens de fumaça e fogo */
function makePuffTexture(){
  const cv=document.createElement('canvas');cv.width=128;cv.height=128;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(64,64,4,64,64,62);
  g.addColorStop(0.0,'rgba(255,255,255,1.0)');
  g.addColorStop(0.35,'rgba(255,255,255,0.72)');
  g.addColorStop(0.70,'rgba(255,255,255,0.24)');
  g.addColorStop(1.0,'rgba(255,255,255,0.0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}

const MAX_P=650;
const pPositions=new Float32Array(MAX_P*3);
const pColors=new Float32Array(MAX_P*3);
const pSizes=new Float32Array(MAX_P);
const pAlphas=new Float32Array(MAX_P);
const pPool=[];
for(let i=0;i<MAX_P;i++)pPool.push({act:false,x:0,y:-999,z:0,vx:0,vy:0,vz:0,r:1,g:1,b:1,sz:1,grow:2,life:0,max:1,grav:0,alpha:0.8});

const ptMat=new THREE.ShaderMaterial({
  uniforms:{uMap:{value:makePuffTexture()}},
  vertexShader:`
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vColor=aColor;
      vAlpha=aAlpha;

      gl_PointSize=clamp(aSize*(520.0/max(1.0,-mv.z)),2.0,220.0);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    uniform sampler2D uMap;
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec4 tex=texture2D(uMap,gl_PointCoord);
      float a=tex.a*vAlpha;
      if(a<0.01)discard;
      gl_FragColor=vec4(vColor,a);
    }
  `,
  transparent:true,depthWrite:false
});

function updateParticles(dt){
  for(let i=0;i<MAX_P;i++){
    const p=pPool[i];
    if(!p.act){
      pAlphas[i]=0;
      continue;
    }
    p.life-=dt;
    if(p.life<=0){p.act=false;pAlphas[i]=0;continue}
    p.vy-=p.grav*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    const r=p.life/p.max;
    pPositions[i*3]=p.x;pPositions[i*3+1]=p.y;pPositions[i*3+2]=p.z;
    pColors[i*3]=p.r;pColors[i*3+1]=p.g;pColors[i*3+2]=p.b;
    pSizes[i]=p.sz*(1+(1-r)*p.grow);
    pAlphas[i]=r*p.alpha;
  }
  ptGeo.attributes.position.needsUpdate=true;
  ptGeo.attributes.aColor.needsUpdate=true;
  ptGeo.attributes.aSize.needsUpdate=true;
  ptGeo.attributes.aAlpha.needsUpdate=true;

  for(const d of debris){
    if(!d.act)continue;
    d.life-=dt;
    if(d.life<=0){d.act=false;d.m.visible=false;continue}
    d.vy-=19.6*dt;
    d.m.position.x+=d.vx*dt;d.m.position.y+=d.vy*dt;d.m.position.z+=d.vz*dt;
    d.m.rotation.x+=d.rx*dt;d.m.rotation.y+=d.ry*dt;d.m.rotation.z+=d.rz*dt;
    if(d.m.position.y<d.groundY){
      d.m.position.y=d.groundY;d.vy=Math.abs(d.vy)*0.42;d.vx*=0.65;d.vz*=0.65;
    }
  }
  if(shockTimer>0){
    shockTimer-=dt;
    const prog=1-(shockTimer/0.45);
    shockRing.scale.setScalar(1+prog*16);
    shockRing.material.opacity=Math.max(0,(1-prog)*0.8);
  }
  if(fireLight.intensity>0.05)fireLight.intensity*=Math.pow(0.08,dt);
  else fireLight.intensity=0;
}

   5. MODELOS 3D (.GLB) COM PIVÔ CONCÊNTRICO NO CENTRO DE CADA RODA
   ===================================================================== */
const dracoLoader=new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');
const gltfLoader=new THREE.GLTFLoader();gltfLoader.setDRACOLoader(dracoLoader);
const gltfCache={},gltfPending={};

const WHEEL_INC=/wheel|roda|tire|tyre|pneu|rim|jante|llanta|whl/i;
const WHEEL_EXC=/caliper|pinca|pinça|disc|disco|brake|freio|arch|fender|well|housing|steer|volante/i;

function isWheelNode(obj,stopAt){
  let cur=obj;
  while(cur&&cur!==stopAt){
    const nm=cur.name||'';
    if(WHEEL_EXC.test(nm))return false;
    if(WHEEL_INC.test(nm))return true;
    cur=cur.parent;
  }
  return false;
}

function applyGLBToCar(vis,gltf,carDef,rotY=0){
  while(vis.body.children.length)vis.body.remove(vis.body.children[0]);
  vis.wh.forEach(w=>w.gw.visible=false);
  vis.glbWheels=[];

  const carRoot=new THREE.Group();
  const root=gltf.scene.clone(true);
  const holder=new THREE.Group();
  root.rotation.y=rotY;
  holder.add(root);

  const b0=new THREE.Box3().setFromObject(holder);
  const sz=b0.getSize(new THREE.Vector3());
  const maxDim=Math.max(sz.x,sz.y,sz.z)||1;
  holder.scale.setScalar((carDef.L*1.62)/maxDim);

  const b1=new THREE.Box3().setFromObject(holder);
  const cen=b1.getCenter(new THREE.Vector3());
  holder.position.set(-cen.x,-b1.min.y,-cen.z);

  carRoot.add(holder);
  carRoot.updateMatrixWorld(true);

  const wheelMeshes=[];
  holder.traverse(child=>{
    if(child.isMesh){
      child.castShadow=true;
      child.receiveShadow=true;
      if(isWheelNode(child,holder))wheelMeshes.push(child);
    }
  });

  const clusters=[];
  wheelMeshes.forEach(m=>{
    const mb=new THREE.Box3().setFromObject(m);
    if(mb.isEmpty())return;
    const mc=mb.getCenter(new THREE.Vector3());
    let clu=clusters.find(c=>c.center.distanceTo(mc)<0.24);
    if(!clu){
      clu={meshes:[],box:mb.clone(),center:mc.clone()};
      clusters.push(clu);
    }else{
      clu.box.union(mb);
      clu.box.getCenter(clu.center);
    }
    clu.meshes.push(m);
  });

  clusters.forEach(clu=>{
    const cPos=clu.box.getCenter(new THREE.Vector3());
    const wRad=Math.max(0.2,((clu.box.max.y-clu.box.min.y)*0.5)||carDef.r);

    const steerPivot=new THREE.Group();
    steerPivot.position.copy(cPos);
    carRoot.add(steerPivot);

    const spinPivot=new THREE.Group();
    steerPivot.add(spinPivot);

    carRoot.updateMatrixWorld(true);
    clu.meshes.forEach(m=>spinPivot.attach(m));

    vis.glbWheels.push({
      steerPivot,
      spinPivot,
      isFront:cPos.z>0.05,
      r:wRad
    });
  });

  vis.body.add(carRoot);
  vis.carRoot=carRoot;
  vis.holder=holder;
  vis.hasGLB=true;
}

function loadCarGLB(vis,carDef){
  if(!carDef.glb)return;
  if(gltfCache[carDef.glb]){
    applyGLBToCar(vis,gltfCache[carDef.glb],carDef,carDef.rotY||0);
    return;
  }
  if(gltfPending[carDef.glb]){
    gltfPending[carDef.glb].push({vis,carDef});
    return;
  }
  gltfPending[carDef.glb]=[{vis,carDef}];
  gltfLoader.load(carDef.glb,gltf=>{
    gltfCache[carDef.glb]=gltf;
    const list=gltfPending[carDef.glb]||[];
    delete gltfPending[carDef.glb];
    list.forEach(item=>applyGLBToCar(item.vis,gltf,item.carDef,item.carDef.rotY||0));
  },undefined,()=>{delete gltfPending[carDef.glb]});
}

function mk(c,overrideColor){
  const g=new THREE.Group(),body=new THREE.Group();g.rotation.order='YXZ';g.add(body);
  const paintCol=overrideColor!==undefined?overrideColor:c.c;
  const M=[
    new THREE.MeshPhysicalMaterial({color:paintCol,metalness:.55,roughness:.22,clearcoat:1.0,clearcoatRoughness:.08}),
    new THREE.MeshPhysicalMaterial({color:0x0b1118,metalness:.2,roughness:.06,transmission:.45,transparent:true,opacity:.82}),
    new THREE.MeshStandardMaterial({color:0x141619,roughness:.65,metalness:.2}),
    new THREE.MeshStandardMaterial({color:0xd8dce0,metalness:.92,roughness:.15})
  ];
  c.parts.forEach(p=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(p[0],p[1],p[2]),M[p[6]]);
    m.position.set(p[3],p[4],p[5]);m.castShadow=true;m.receiveShadow=true;body.add(m);
  });
  const fZ=c.L*0.48,rZ=-c.L*0.48,wX=c.t[0]*0.38;
  const hlMat=new THREE.MeshBasicMaterial({color:0xfff8d6});
  const blMat=new THREE.MeshBasicMaterial({color:0x7a0808});
  [-1,1].forEach(sd=>{
    const hl=new THREE.Mesh(new THREE.BoxGeometry(.34,.12,.06),hlMat);hl.position.set(sd*wX,.45,fZ);body.add(hl);
    const bl=new THREE.Mesh(new THREE.BoxGeometry(.38,.14,.06),blMat);bl.position.set(sd*wX,.52,rZ);body.add(bl);
  });
  const flames=[-0.35,0.35].map(x=>{
    const f=new THREE.Mesh(new THREE.ConeGeometry(.12,.85,8),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.92}));
    f.rotation.x=-Math.PI/2;f.position.set(x,.32,rZ-.38);f.visible=false;g.add(f);return f;
  });
  const wh=[],a=c.L*(1-c.wf),b=c.L*c.wf;
  for(let w=0;w<4;w++){
    const fr=w<2,sd=w%2?-1:1,gw=new THREE.Group(),cy=new THREE.CylinderGeometry(c.r,c.r,c.ww,28);cy.rotateZ(Math.PI/2);
    const sp=new THREE.Mesh(cy,M[2]);sp.castShadow=true;
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(c.r*.68,c.r*.68,c.ww+.02,18),M[3]);rim.rotation.z=Math.PI/2;sp.add(rim);
    sp.add(new THREE.Mesh(new THREE.BoxGeometry(c.ww+.03,c.r*1.25,.05),M[2]));
    gw.add(sp);gw.position.set(sd*c.t[fr?0:1]/2,c.r,fr?a:-b);g.add(gw);wh.push({gw,sp,fr,sd});
  }
  const vis={g,body,wh,glbWheels:[],hasGLB:false,carRoot:null,holder:null,blMat,flames,paintMat:M[0]};
  loadCarGLB(vis,c);
  return vis;
}

let au=null,engOsc=null,engSub=null,engFilter=null,engGain=null,screechGain=null,audioOn=true;
function initAudio(){
  if(au)return;
  try{
    au=new(window.AudioContext||window.webkitAudioContext)();
    engOsc=au.createOscillator();engOsc.type='sawtooth';
    engSub=au.createOscillator();engSub.type='triangle';
    engFilter=au.createBiquadFilter();engFilter.type='lowpass';engFilter.frequency.value=400;
    engGain=au.createGain();engGain.gain.value=0;
    engOsc.connect(engFilter);engSub.connect(engFilter);engFilter.connect(engGain);engGain.connect(au.destination);
    engOsc.start();engSub.start();

    const buf=au.createBuffer(1,au.sampleRate*2,au.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
    const noise=au.createBufferSource();noise.buffer=buf;noise.loop=true;
    const bp=au.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1150;bp.Q.value=6;
    screechGain=au.createGain();screechGain.gain.value=0;
    noise.connect(bp);bp.connect(screechGain);screechGain.connect(au.destination);
    noise.start();
  }catch(e){au=null}
}
function playCrashSound(heavy=false){
  if(!au||!audioOn)return;
  const t=au.currentTime,buf=au.createBuffer(1,au.sampleRate*(heavy?1.05:.32),au.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(au.sampleRate*(heavy?.32:.09)));
  const src=au.createBufferSource();src.buffer=buf;
  const f=au.createBiquadFilter();f.type='lowpass';f.frequency.value=heavy?480:950;
  const g=au.createGain();g.gain.setValueAtTime(heavy?.5:.26,t);g.gain.exponentialRampToValueAtTime(.001,t+(heavy?1.05:.32));
  src.connect(f);f.connect(g);g.connect(au.destination);src.start();
}

function updateRivals(dt){
  const curTime=performance.now()/1000;
  const isArena=TRACKS[trackIdx].fullWalls;
  for(const rv of rivals){
    if(rv.wrecked){
      rv.wreckTimer-=dt;
      rv.x+=rv.vx*dt;rv.z+=rv.vz*dt;rv.vx*=(1-2.4*dt);rv.vz*=(1-2.4*dt);
      rv.psi+=rv.spinVel*dt;rv.spinVel*=(1-1.4*dt);
      const s=surf(rv.x,rv.z,Math.floor(rv.p)%NP);
      rv.y=s.y;
      rv.vis.g.position.set(rv.x,rv.y,rv.z);
      rv.vis.g.rotation.set(0.22,rv.psi,0.42);
      if(Math.random()<0.75){
        spawnParticle(rv.x,rv.y+.7,rv.z,(Math.random()-.5)*2,3+Math.random()*3,(Math.random()-.5)*2,Math.random()<.5?0xff6a00:0x1b1b1e,1.4,1.1,0,2.2,0.85);
      }
      if(rv.wreckTimer<=0){
        rv.wrecked=false;rv.hp=rv.maxHp;rv.spinVel=0;rv.vx=rv.vz=0;
        const ahead=(ST.hint+20+rv.id*5)%NP;
        rv.p=(Math.floor(ST.hint/NP)*NP)+ahead;
        rv.x=pts[ahead].x+nr[ahead].x*rv.lane;
        rv.z=pts[ahead].z+nr[ahead].z*rv.lane;
        rv.y=pts[ahead].y;
        rv.psi=Math.atan2(tg[ahead].x,tg[ahead].z);
        rv.v=Math.max(35,ST.u*0.85);
      }
      continue;
    }

    const idx=((Math.floor(rv.p)%NP)+NP)%NP,nxt=(idx+1)%NP;
    const turn=Math.acos(cl(tg[idx].dot(tg[(idx+8)%NP]),-1,1));
    const playerProg=(lap-1)*NP+ST.hint;
    const gap=playerProg-rv.p;
    const catchup=isArena?1.02:cl(1+gap*0.004,0.84,1.22);
    const baseSpd=isArena?54:68;
    const targetV=(baseSpd*rv.skill*catchup)*(1-Math.min(.45,turn*1.4));

    if(mode==='race'){
      rv.v+=cl(targetV-rv.v,-28*dt,24*dt);
      const segLen=Math.hypot(pts[nxt].x-pts[idx].x,pts[nxt].z-pts[idx].z)||1;
      rv.p+=(rv.v*dt)/segLen;
    }

    const i2=((Math.floor(rv.p)%NP)+NP)%NP,j2=(i2+1)%NP,f2=rv.p-Math.floor(rv.p);
    const off=rv.lane+Math.sin(rv.p*0.03+rv.id*2.1)*(isArena?3.2:2.2);
    const tx=pts[i2].x+(pts[j2].x-pts[i2].x)*f2+nr[i2].x*off;
    const tz=pts[i2].z+(pts[j2].z-pts[i2].z)*f2+nr[i2].z*off;
    const ty=pts[i2].y+(pts[j2].y-pts[i2].y)*f2;
    const dx=tx-rv.x,dz=tz-rv.z;
    if(mode==='race'&&Math.hypot(dx,dz)>0.01)rv.psi=Math.atan2(dx,dz);
    rv.x=tx;rv.y=ty;rv.z=tz;

    rv.vis.g.position.set(rv.x,rv.y,rv.z);
    rv.vis.g.rotation.set(0,rv.psi,0);
    rv.vis.wh.forEach(w=>w.sp.rotation.x+=rv.v*dt/rv.c.r);
    rv.vis.glbWheels.forEach(w=>w.spinPivot.rotation.x+=rv.v*dt/w.r);

    if(rv.hp<65&&Math.random()<0.45){
      const isBurning=rv.hp<35;
      spawnParticle(rv.x,rv.y+.75,rv.z,(Math.random()-.5)*1.6,2.2+Math.random()*2.5,(Math.random()-.5)*1.6,isBurning?(Math.random()<.5?0xff6b00:0xffbe0b):0x2b2d30,isBurning?.9:1.1,.75,0,2.0,0.8);
    }

    if(mode==='race'&&!rv.wrecked&&playerWreckTimer<=0){
      const pSin=Math.sin(ST.psi),pCos=Math.cos(ST.psi);
      const rSin=Math.sin(rv.psi),rCos=Math.cos(rv.psi);
      const pPts=[[ST.x+pSin*1.15,ST.z+pCos*1.15],[ST.x-pSin*1.15,ST.z-pCos*1.15]];
      const rPts=[[rv.x+rSin*1.15,rv.z+rCos*1.15],[rv.x-rSin*1.15,rv.z-rCos*1.15]];

      let minD=99,bestP=null,bestR=null,hitRear=false;
      for(let a=0;a<2;a++)for(let b=0;b<2;b++){
        const d=Math.hypot(pPts[a][0]-rPts[b][0],pPts[a][1]-rPts[b][1]);
        if(d<minD){minD=d;bestP=pPts[a];bestR=rPts[b];hitRear=(b===1)}
      }
      const minSep=1.9;
      if(minD<minSep&&minD>0.001){
        const nx=(bestP[0]-bestR[0])/minD,nz=(bestP[1]-bestR[1])/minD,pen=minSep-minD;
        ST.x+=nx*pen*0.48;ST.z+=nz*pen*0.48;
        rv.lane+=((-nx*nr[i2].x-nz*nr[i2].z)*pen*1.7);
        rv.lane=cl(rv.lane,-W/2+1.2,W/2-1.2);

        const relV=Math.hypot(ST.u*pSin+ST.v*pCos-rv.v*rSin,ST.u*pCos-ST.v*pSin-rv.v*rCos)+5;
        ST.u*=0.93;
        if(curTime-rv.lastHit>0.16){
          rv.lastHit=curTime;
          const boostBonus=K.boost&&nitro>0?1.85:1.0;
          const massRatio=car.m/(rv.c.m||1350);
          const dmg=(relV*1.75+(hitRear?14:7))*boostBonus*massRatio;
          rv.hp-=dmg;
          playerHp=Math.max(0,playerHp-dmg*0.28);
          const hitPts=Math.round(dmg*14);
          score+=hitPts;
          if(score>highScore){highScore=score;lsSet('gpHighScore',highScore)}
          nitro=Math.min(1,nitro+0.12);
          shake=Math.min(0.75,relV*0.018);
          playCrashSound(false);

          const cx=(bestP[0]+bestR[0])/2,cz=(bestP[1]+bestR[1])/2;
          spawnDebris(cx,ST.y+.65,cz,AI_COLORS[rv.id],6);
          for(let s=0;s<18;s++){
            spawnParticle(cx,ST.y+.6,cz,(Math.random()-.5)*14,3+Math.random()*8,(Math.random()-.5)*14,s%2?0xffd166:0xff6b00,.45,.5,18,1.2,0.95);
          }

          if(playerHp<=0&&playerWreckTimer<=0){
            playerWreckTimer=2.5;
            spawnFireBurst(ST.x,ST.y,ST.z,1.3);
            spawnDebris(ST.x,ST.y+.8,ST.z,car.c,14);
            triggerShockwave(ST.x,ST.y,ST.z);
            playCrashSound(true);
            banner('CARRO DESTRUÍDO!','Reparando veículo...',2200);
          }else if(rv.hp<=0){
            rv.vx=-nx*24+rSin*rv.v*0.5;
            rv.vz=-nz*24+rCos*rv.v*0.5;
            rv.spinVel=(Math.random()<.5?1:-1)*9.5;
            triggerWreck(rv,relV);
          }else{
            banner('',`IMPACTO +${hitPts} PTS`,650);
          }
        }
      }
    }
  }
}

}

/* =====================================================================
   9. FÍSICA VEICULAR SIMULADOR (240Hz + BURNOUT REAL + PACEJKA + LSD)
   ===================================================================== */
function world(){
  const S=ST,sp=Math.sin(S.psi),cp=Math.cos(S.psi),e=surf(S.x,S.z,S.hint);
  S.hint=e.i;
  const sd=e.s>=0?1:-1;
  const walled=hasWallAt(e.i,sd);
  const wallLimit=W/2+0.55;
  const escapeLimit=W/2+12.5;

  if(walled&&e.d>wallLimit){
    const pen=e.d-wallLimit;
    const nx=nr[e.i].x*sd,nz=nr[e.i].z*sd;
    S.x-=nx*pen;S.z-=nz*pen;

    const vx=S.u*sp+S.v*cp,vz=S.u*cp-S.v*sp;
    const vn=vx*nx+vz*nz;
    if(vn>0){
      const impulse=vn*1.28;
      const nvx=vx-nx*impulse,nvz=vz-nz*impulse;
      S.u=(nvx*sp+nvz*cp)*0.92;
      S.v=(nvx*cp-nvz*sp)*0.75;
      S.r*=0.65;
      if(vn>3.5){
        playerHp=Math.max(0,playerHp-vn*0.6);
        shake=Math.min(0.55,vn*0.025);
        playCrashSound(false);
        const sideX=S.x+nx*0.9,sideZ=S.z+nz*0.9;
        spawnDebris(sideX,S.y+.5,sideZ,car.c,3);
        for(let k=0;k<10;k++){
          spawnParticle(sideX,S.y+.45,sideZ,(Math.random()-.5)*8,2+Math.random()*5,(Math.random()-.5)*8,0xffbe0b,.4,.38,16,1.1,0.95);
        }
      }
    }
  }else if(e.d>escapeLimit){
    const k=e.s-Math.sign(e.s)*escapeLimit;
    S.x-=nr[e.i].x*k;S.z-=nr[e.i].z*k;S.u*=.82;S.v*=.45;S.r*=.6;
  }

  S.y=e.y;S.d=e.d;
  S.sf=e.d<W/2?1:e.d<W/2+1.4?1-.18*Math.min(1,(U.kf+U.kr)/400):.72;
  const f=surf(S.x+sp*car.L/2,S.z+cp*car.L/2,e.i).y,r=surf(S.x-sp*car.L/2,S.z-cp*car.L/2,e.i).y;
  S.slope=Math.atan2(f-r,car.L);

  if(e.i>NP*.45&&e.i<NP*.55)half=true;
  if(mode==='race'&&prevI>NP*.9&&e.i<NP*.1&&half){
    half=false;const n=performance.now()/1000,lt=n-tv;tv=n;
    playerHp=Math.min(100,playerHp+30);
    if(!best||lt<best){best=lt;lsSet('gpBest',best)}
    if(lap>=LAPS){
      mode='done';tot=n-t0;
      const rank=1+rivals.filter(rv=>!rv.wrecked&&rv.p>(LAPS-1)*NP+S.hint).length;
      menu(`Pista: <b>${TRACKS[trackIdx].name}</b> · Posição: <b>${rank}º Lugar</b><br>Rivais destruídos: ${wrecks} · Pontuação: <b>${score.toLocaleString()} PTS</b><br>Tempo: ${fmt(tot)} · Melhor volta: ${fmt(best)}`,'Correr de Novo');
    }else{
      lap++;banner(`VOLTA ${lap}/${LAPS}`,`Tempo da volta: ${fmt(lt)}`,1400);
    }
  }
  prevI=e.i;
}

function phys(dt){
  const c=car,s=U,S=ST,m=c.m,L=c.L,b=c.wf*L,a=L-b,tf=c.t[0],tr=c.t[1];
  if(mode==='count'||mode==='menu'||playerWreckTimer>0){S.u=S.v=S.r=S.wDrive=S.slipAng=S.eb=0;S.burnout=false;return}
  const go=mode==='race',kf=s.kf*1000,kr=s.kr*1000,Kf=kf*tf*tf/2,Kr=kr*tr*tr/2,rd=Kf/(Kf+Kr),
        hcg=c.hcg+(s.h-c.s.h)/1000,hh=Math.max(.05,hcg-.1),cz=c.cz*cl(1+(c.s.h-s.h)/1000*5,.6,1.6);

  /* Detecção de Burnout: Acelerador + Freio (ou Freio de Mão) pressionados juntos em baixa velocidade */
  const wantsBurnout=go&&K.up&&(K.down||K.ebrake)&&S.u<15;
  const rev=go&&K.down&&!K.up&&S.u<=1.2&&!K.ebrake;
  S.rd=rd;

  const boosting=go&&K.boost&&nitro>0.02&&(S.u>4||wantsBurnout);
  if(boosting)nitro=Math.max(0,nitro-0.25*dt);
  else nitro=Math.min(1,nitro+0.035*dt);

  S.th+=((go&&K.up?1:0)-S.th)*Math.min(1,dt*14);
  S.bk+=(((go&&K.down&&(S.u>1.2||wantsBurnout))||mode==='done'?1:0)-S.bk)*Math.min(1,dt*16);
  S.eb+=((go&&K.ebrake?1:0)-S.eb)*Math.min(1,dt*20);

  const si=go?(K.left?1:0)-(K.right?1:0):0;
  const steerSpeed=si?(Math.sign(si)!==Math.sign(S.st)?14:9.5):12.5;
  S.st+=(si-S.st)*Math.min(1,dt*steerSpeed);

  const u=S.u;
  const maxLock=0.55/(1+0.00062*u*u);
  const casterAlign=Math.abs(u)>6?cl(-S.slipAng*0.56,-0.40,0.40):0;
  S.del=cl(S.st*maxLock+casterAlign,-0.65,0.65);

  /* Dinâmica Independente do Eixo Motriz (wDrive) e Embreagem */
  const effR=c.r*(s.ws||1.0);
  const wheelRpm=Math.abs(S.wDrive)*c.g[S.gear]*c.fd*9.549;
  const clutchRpm=S.th>0.05?(2400+S.th*2600):1000;
  S.rpm=Math.max(wheelRpm,clutchRpm);

  if(S.rpm>c.rm*.95&&S.gear<c.g.length-1&&!wantsBurnout)S.gear++;
  else if(S.rpm<c.rm*.45&&S.gear>0)S.gear--;

  let Tq=0;const T=c.T;
  for(let i=1;i<T.length;i++)if(S.rpm<=T[i][0]||i===T.length-1){Tq=T[i-1][1]+(T[i][1]-T[i-1][1])*cl((S.rpm-T[i-1][0])/(T[i][0]-T[i-1][0]),0,1);break}
  if(S.rpm>=c.rm*0.995)Tq*=0.15; /* Corte de giro suave */

  const boostMult=boosting?1.55:1.0;
  const engineWheelForce=(Tq*c.g[S.gear]*c.fd*.95/effR*S.th)*boostMult;
  const revWheelForce=Tq*c.g[0]*c.fd*.9/effR*.35;

  const df=.5*RHO*u*u*cz,lon=S.ax,lat=S.ay,dLon=m*lon*hcg/L,dF=m*lat*(b/L*.08/tf+hh*rd/tf),dR=m*lat*(a/L*.1/tr+hh*(1-rd)/tr);
  const AX=[m*G*b/L-dLon+df*c.ab,m*G*a/L+dLon+df*(1-c.ab)];
  const targetRoll=cl(m*lat*hh/(Kf+Kr-m*G*hh),-.12,.12);
  const targetPitch=cl(m*lon*hh/(2*kf*a*a+2*kr*b*b),-.065,.065);
  S.roll+=(targetRoll-S.roll)*Math.min(1,dt*15);
  S.bp+=(targetPitch-S.bp)*Math.min(1,dt*15);

  const slipDeg=Math.abs(S.slipAng)/DEG;
  const powerSlide=(c.dr==='R'&&S.th>0.6&&(slipDeg>7||S.eb>0.1))?cl((S.th-0.55)*1.5,0,1):0;

  let Fx=0,Fy=0,Mz=0,FxT=0,driveReactionForce=0;
  for(let w=0;w<4;w++){
    const fr=w<2,sd=w%2?-1:1,xi=fr?a:-b,yi=sd*(fr?tf:tr)/2,Fz=Math.max(100,AX[fr?0:1]/2-sd*(fr?dF:dR));
    S.fz[w]=Fz;
    const Fz0=m*G/4;
    const loadSens=1-0.11*((Fz-Fz0)/Fz0);
    const cam_=(fr?s.cf:s.cr)+(sd*lat<0?1:-1)*.65*Math.abs(S.roll)/DEG,
          fc=1.05-.004*Math.pow(cam_+3.0,2),
          Fm=c.mu*loadSens*S.sf*Fz;

    const dw=(fr?S.del:0)-sd*(fr?s.tf:s.tr)*DEG,co=Math.cos(dw),sn=Math.sin(dw),
          vx=u-S.r*yi,vy=S.v+S.r*xi,vl=vx*co+vy*sn,vt=-vx*sn+vy*co;

    const drv=(c.dr==='R')!==fr;
    const wheelLinSpeed=drv?(S.wDrive*effR):vl;
    const slipSpeed=wheelLinSpeed-vl;

    /* Perda de aderência lateral proporcional ao destracionamento (Burnout / Power Slide) */
    const spinLoss=drv?cl(Math.abs(slipSpeed)/28,0,0.68):0;
    const alpha=Math.atan2(vt,Math.max(Math.abs(vl),Math.abs(wheelLinSpeed)*0.35)+1.6);
    const B=fr?12.4:11.2,C=1.42,E=-0.45;
    const Ba=B*alpha;
    const pacejkaLat=Math.sin(C*Math.atan(Ba-E*(Ba-Math.atan(Ba))));

    let latGrip=1.0-spinLoss;
    if(!fr){
      latGrip*=(1-0.76*S.eb);
      latGrip*=(1-0.25*powerSlide);
    }else{
      latGrip*=1.06;
    }

    const fy=-Fm*fc*latGrip*pacejkaLat;
    let cmd=0;

    if(drv){
      if(rev){
        cmd=-revWheelForce/2;
      }else if(wantsBurnout){
        /* Durante burnout, o freio é liberado no eixo motriz para os pneus girarem livres */
        const kappa=slipSpeed/Math.max(Math.abs(vl),2.5);
        const pacejkaLon=Math.sin(1.55*Math.atan(9.0*kappa));
        cmd=Fm*fc*0.58*pacejkaLon;
      }else{
        const lsdBias=1+(c.lsd||0.4)*0.18;
        cmd=(engineWheelForce/2)*lsdBias-S.bk*3.6*m*G*(fr?c.br:1-c.br)/2*cl(vl/.5,-1,1);
        if(!fr&&S.eb>0.01)cmd-=S.eb*2.2*m*G*0.5*cl(vl/.45,-1,1);
      }
      driveReactionForce+=cmd;
    }else{
      /* Eixo não-motriz: freios travam o carro firmemente durante o burnout */
      const holdMult=wantsBurnout?5.5:3.8;
      cmd-=S.bk*holdMult*m*G*(fr?c.br:1-c.br)/2*cl(vl/.25,-1,1);
      if(!fr&&S.eb>0.01)cmd-=S.eb*4.5*m*G*0.5*cl(vl/.25,-1,1);
    }

    const lim=Math.sqrt(Math.max(0,Math.pow(Fm*fc,2)-fy*fy)),fx=cl(cmd,-lim,lim),bx=fx*co-fy*sn,by=fx*sn+fy*co;
    Fx+=bx;Fy+=by;FxT+=bx;Mz+=xi*by-yi*bx;
  }

  /* Integração da velocidade angular do eixo motriz (wDrive) */
  const Idrive=2.8;
  if(rev){
    S.wDrive=u/effR;
  }else if(wantsBurnout){
    const netDriveForce=engineWheelForce-driveReactionForce*0.65;
    S.wDrive+=(netDriveForce*effR/Idrive)*dt;
    const maxW=(c.rm*0.99)/(c.g[0]*c.fd*9.549);
    S.wDrive=cl(S.wDrive,0,maxW);
  }else if(S.th>0.05){
    const targetW=Math.max(u/effR,(u/effR)+(engineWheelForce/(m*4.5)));
    S.wDrive+=(targetW-S.wDrive)*Math.min(1,dt*18);
  }else{
    S.wDrive+=(u/effR-S.wDrive)*Math.min(1,dt*25);
  }

  S.burnout=Math.abs(S.wDrive*effR-u)>7.5&&S.th>0.25;

  const Iz=m*(0.25*L*L+0.23*tf*tf);
  const yawDamp=-S.r*m*(0.52+0.028*Math.abs(u))*(1-0.58*S.eb);
  Fx+=-.5*RHO*c.cd*u*Math.abs(u)-.012*m*G*cl(u,-1,1)-m*G*Math.sin(S.slope);

  /* Permite girar o carro em Donuts durante o burnout ao esterçar */
  if(S.burnout&&Math.abs(S.st)>0.1){
    const donutDir=(c.dr==='R'?1:-1)*S.st;
    Mz+=donutDir*m*2.8;
  }

  S.u+=(Fx/m+S.v*S.r)*dt;
  S.v+=(Fy/m-u*S.r)*dt;
  S.r+=((Mz+yawDamp)/Iz)*dt;

  if(Math.abs(S.u)<2.8&&S.th<0.05){const k=1-Math.min(1,dt*(4.5-Math.abs(S.u))*2);S.v*=k;S.r*=k}
  const f=cl(dt*(10+10*s.z),0,1);S.ax+=(FxT/m-S.ax)*f;S.ay+=(Fy/m-S.ay)*f;
  S.psi+=S.r*dt;
  const sp=Math.sin(S.psi),cp=Math.cos(S.psi);
  S.x+=(S.u*sp+S.v*cp)*dt;S.z+=(S.u*cp-S.v*sp)*dt;
  S.slipAng=Math.abs(S.u)>4.2?Math.atan2(S.v,Math.abs(S.u)):0;
}

function updateDriftAndFX(dt){
  const S=ST,c=car,spdKmh=Math.abs(S.u)*3.6,degSlip=Math.abs(S.slipAng)/DEG;
  const handbrakeLock=mode==='race'&&spdKmh>20&&S.eb>0.35&&!S.burnout;
  const isDrifting=mode==='race'&&spdKmh>30&&(degSlip>8.0||handbrakeLock)&&S.d<W/2+1.2;

  const sp=Math.sin(S.psi),cp=Math.cos(S.psi);
  const isFWD=c.dr==='F';
  const axleDist=isFWD?c.L*(1-c.wf):-c.wf*c.L;
  const ht=(isFWD?c.t[0]:c.t[1])/2;
  const dLx=S.x+sp*axleDist-cp*ht,dLz=S.z+cp*axleDist+sp*ht;
  const dRx=S.x+sp*axleDist+cp*ht,dRz=S.z+cp*axleDist-sp*ht;

  if(playerWreckTimer>0){
    playerWreckTimer-=dt;
    if(Math.random()<0.7)spawnParticle(S.x,S.y+.8,S.z,(Math.random()-.5)*2,3+Math.random()*3,(Math.random()-.5)*2,0xff6a00,1.4,1.0,0,2.2,0.85);
    if(playerWreckTimer<=0){
      playerHp=100;
      const i=surf(S.x,S.z,S.hint).i;
      Object.assign(S,{x:pts[i].x,z:pts[i].z,psi:Math.atan2(tg[i].x,tg[i].z),u:0,v:0,r:0,wDrive:0,hint:i});
    }
  }

  if(mode==='race'&&playerHp<65&&Math.random()<0.45){
    const burning=playerHp<35;
    spawnParticle(S.x+sp*1.1,S.y+.75,S.z+cp*1.1,(Math.random()-.5)*1.4,2.2+Math.random()*2,(Math.random()-.5)*1.4,burning?(Math.random()<.5?0xff6a00:0xffbe0b):0x2b2d30,burning?.85:1.0,.7,0,1.9,0.8);
  }

  /* Fumaça volumétrica e marcas de pneu no Drift e no Burnout */
  if(isDrifting||handbrakeLock||S.burnout){
    if(prevDriveL){addSkid(prevDriveL[0],S.y,prevDriveL[1],dLx,S.y,dLz,c.ww*1.15);addSkid(prevDriveR[0],S.y,prevDriveR[1],dRx,S.y,dRz,c.ww*1.15)}
    const smokeRate=S.burnout?2:1;
    for(let k=0;k<smokeRate;k++){
      spawnParticle(dLx+(Math.random()-.5)*.25,S.y+.22,dLz+(Math.random()-.5)*.25,(Math.random()-.5)*2.2,1.4+Math.random()*1.6,(Math.random()-.5)*2.2,0xf0f2f5,S.burnout?1.35:1.05,.95,-0.6,2.8,0.52);
      spawnParticle(dRx+(Math.random()-.5)*.25,S.y+.22,dRz+(Math.random()-.5)*.25,(Math.random()-.5)*2.2,1.4+Math.random()*1.6,(Math.random()-.5)*2.2,0xf0f2f5,S.burnout?1.35:1.05,.95,-0.6,2.8,0.52);
    }
  }

  if(S.burnout){
    score+=Math.round(95*dt);
    if(score>highScore){highScore=score;lsSet('gpHighScore',highScore)}
    $('driftLive').textContent=`BURNOUT! ${Math.round(S.rpm)} RPM`;
  }else if(isDrifting&&degSlip>8.0){
    driftTimer=1.35;
    const rate=(degSlip*4.2+spdKmh*1.7)*dt;
    driftPts+=rate;
    driftMult=driftPts>1500?5:driftPts>700?3:driftPts>250?2:1;
    nitro=Math.min(1,nitro+0.18*dt);
    $('driftLive').textContent=`DRIFT ${Math.round(degSlip)}° · ${Math.round(driftPts)} ×${driftMult}`;
  }else{
    if(driftTimer>0){
      driftTimer-=dt;
      if(driftTimer<=0&&driftPts>20){
        const banked=Math.round(driftPts*driftMult);
        score+=banked;
        if(score>highScore){highScore=score;lsSet('gpHighScore',highScore)}
        driftPts=0;driftMult=1;
        $('driftLive').textContent=`+${banked} PTS!`;
        setTimeout(()=>{if(driftPts===0&&!S.burnout)$('driftLive').textContent=''},900);
      }
    }else if($('driftLive').textContent.startsWith('BURNOUT')){
      $('driftLive').textContent='';
    }
  }
  prevDriveL=[dLx,dLz];prevDriveR=[dRx,dRz];

  const boosting=mode==='race'&&K.boost&&nitro>0.02&&(S.u>4||S.burnout);
  V.blMat.color.setHex((S.bk>0.1||S.eb>0.1)?0xff1e1e:0x660606);
  V.flames.forEach(fl=>{fl.visible=boosting;if(boosting)fl.scale.z=0.7+Math.random()*0.85});

  if(au&&audioOn){
    const rpmRatio=S.rpm/c.rm;
    engOsc.frequency.value=48+rpmRatio*200;
    engSub.frequency.value=24+rpmRatio*100;
    engFilter.frequency.value=260+S.th*950+rpmRatio*720;
    engGain.gain.value=(mode==='race'||mode==='count')?(0.045+S.th*0.048):0;
    const tireSlip=S.burnout?24:Math.max(degSlip-8,handbrakeLock?16:0);
    screechGain.gain.value=(isDrifting||handbrakeLock||S.burnout)?cl(tireSlip/24,0,0.105):0;
  }else if(au){
    engGain.gain.value=0;screechGain.gain.value=0;
  }
}

/* =====================================================================
   10. INTERFACE, CÂMERAS LATERAIS (Q / E) E LOOP PRINCIPAL
   ===================================================================== */
function menu(txt,btn){
  mode='menu';$('ov').style.display='flex';
  $('ov').innerHTML=`<div class="p"><h1>GP LAGUNA</h1><p>${txt}</p>
    <div class="sec-lbl">Escolha a Pista</div>
    <div class="row">${TRACKS.map((t,i)=>`<button data-t="${i}" class="${i===trackIdx?'sel':''}">${t.name}</button>`).join('')}</div>
    <div class="sec-lbl">Escolha o Carro</div>
    <div class="row">${CARS.map((c,i)=>`<button data-i="${i}" class="${c===car?'sel':''}">${c.n}</button>`).join('')}</div>
    <label class="glb-btn" id="pickGlb">📂 Carregar Skin 3D (.glb / .gltf)</label><br>
    <button id="go">${btn}</button></div>`;
  $('pickGlb').onclick=()=>$('glbInput').click();
  $('ov').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{buildTrack(+b.dataset.t);place();spawnRivals();menu(txt,btn)});
  $('ov').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{pick(+b.dataset.i);menu(txt,btn)});
  $('go').onclick=start;
}
function start(){
  initAudio();
  $('ov').style.display='none';
  score=0;wrecks=0;driftPts=0;driftMult=1;nitro=1.0;slowMo=0;
  place();spawnRivals();
  mode='count';let n=3;$('msg').textContent=n;$('msgSub').textContent='';
  const iv=setInterval(()=>{
    n--;
    if(n>0)$('msg').textContent=n;
    else{clearInterval(iv);$('msg').textContent='VAI!';mode='race';t0=tv=performance.now()/1000;setTimeout(()=>$('msg').textContent='',850)}
  },850);
}

const kmap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'ebrake',KeyO:'boost',KeyQ:'lookL',KeyE:'lookR'};
addEventListener('keydown',e=>{
  if(kmap[e.code]){K[kmap[e.code]]=1;e.preventDefault()}
  if(e.repeat)return;
  if(e.code==='KeyT')$('bs').click();
  if(e.code==='KeyC')camMode=(camMode+1)%3;
  if(e.code==='KeyM')$('ba').click();
  if(e.code==='KeyP'&&mode==='race'){paused=!paused;$('msg').textContent=paused?'PAUSA':''}
  if(e.code==='KeyR'&&mode==='race'){const i=surf(ST.x,ST.z,-1).i;Object.assign(ST,{x:pts[i].x,z:pts[i].z,psi:Math.atan2(tg[i].x,tg[i].z),u:0,v:0,r:0,wDrive:0,hint:i})}
});
addEventListener('keyup',e=>{if(kmap[e.code])K[kmap[e.code]]=0});

$('ba').onclick=()=>{audioOn=!audioOn;$('ba').textContent='Som: '+(audioOn?'ON':'OFF')};
$('bs').onclick=()=>{const s=$('set');s.style.display=s.style.display==='block'?'none':'block'};
$('bm').onclick=()=>menu('Segure <b>W + S</b> (ou <b>W + Espaço</b>) parado para fazer Burnout!','Largar');

const mm=$('mm'),mc=mm.getContext('2d');
function getMapBounds(){
  let bx0=1e9,bx1=-1e9,bz0=1e9,bz1=-1e9;
  pts.forEach(p=>{bx0=Math.min(bx0,p.x);bx1=Math.max(bx1,p.x);bz0=Math.min(bz0,p.z);bz1=Math.max(bz1,p.z)});
  return{bx0,bx1,bz0,bz1};
}

let sideAngle=0;
function render(dt,t){
  const S=ST,c=car,ws=U.ws||1.0;
  V.g.position.set(S.x,S.y,S.z);
  V.g.rotation.set(-S.slope-S.bp,S.psi,S.roll);
  V.body.position.y=(U.h-c.s.h)/1000-.02;

  /* Rotação visual realista: rodas de tração giram com wDrive (burnout!), livres com S.u */
  const isFWD=c.dr==='F';
  V.wh.forEach(w=>{
    const toe=(w.fr?S.del:0)-w.sd*(w.fr?U.tf:U.tr)*DEG;
    w.gw.rotation.set(0,toe,-w.sd*(w.fr?U.cf:U.cr)*DEG);
    w.gw.scale.setScalar(ws);
    w.gw.position.y=c.r*ws;
    const isDriven=(w.fr===isFWD);
    const omega=isDriven?S.wDrive:(S.u/(c.r*ws));
    w.sp.rotation.x+=omega*dt;
  });
  if(V.carRoot)V.carRoot.position.y=(ws-1)*c.r;
  V.glbWheels.forEach(w=>{
    w.steerPivot.scale.setScalar(ws);
    w.steerPivot.rotation.y=w.isFront?S.del:0;
    const isDriven=(w.isFront===isFWD);
    const omega=isDriven?S.wDrive:(S.u/(w.r*ws));
    w.spinPivot.rotation.x+=omega*dt;
  });

  sun.position.set(S.x+65,S.y+95,S.z+45);sun.target.position.set(S.x,S.y,S.z);

  const sp=Math.sin(S.psi),cp=Math.cos(S.psi);
  const shX=shake>0?(Math.random()-.5)*shake:0,shY=shake>0?(Math.random()-.5)*shake:0;
  shake=Math.max(0,shake-dt*2.4);

  let targetSide=0;
  if(K.lookL&&K.lookR)targetSide=Math.PI;
  else if(K.lookL)targetSide=Math.PI/2;
  else if(K.lookR)targetSide=-Math.PI/2;
  sideAngle+=(targetSide-sideAngle)*Math.min(1,dt*14);

  if(mode==='menu'){
    const a=t*.00035;cam.position.set(S.x+Math.sin(a)*8.5,S.y+2.8,S.z+Math.cos(a)*8.5);cam.lookAt(S.x,S.y+.8,S.z);
  }else if(Math.abs(sideAngle)>0.04){
    const viewYaw=S.psi+sideAngle;
    const vs=Math.sin(viewYaw),vc=Math.cos(viewYaw);
    cam.position.set(S.x-vs*6.6+shX,S.y+2.25+shY,S.z-vc*6.6);
    cam.lookAt(S.x,S.y+1.05,S.z);
  }else if(camMode===1){
    cam.position.set(S.x+sp*(c.L*.2)+shX,S.y+1.08+shY,S.z+cp*(c.L*.2));
    cam.lookAt(S.x+sp*30,S.y+1.0+S.slope*30,S.z+cp*30);
  }else{
    const distBack=camMode===2?11.5:8.2,heightUp=camMode===2?4.5:3.0;
    const k=1-Math.exp(-8*dt),tx=S.x-sp*distBack,tz=S.z-cp*distBack,ty=S.y+heightUp;
    cam.position.x+=(tx-cam.position.x)*k+shX;
    cam.position.z+=(tz-cam.position.z)*k;
    cam.position.y+=(ty-cam.position.y)*k+shY;
    cam.lookAt(S.x+sp*8,S.y+1.15,S.z+cp*8);
  }
  const boosting=mode==='race'&&K.boost&&nitro>0.02&&(S.u>4||S.burnout);
  cam.fov=62+Math.min(24,Math.abs(S.u)*.22)+(boosting?7:0);
  cam.updateProjectionMatrix();

  const playerProg=(lap-1)*NP+S.hint;
  const posRank=1+rivals.filter(rv=>!rv.wrecked&&rv.p>playerProg).length;

  $('pts').textContent=`${score.toLocaleString()} PTS`;
  $('subPts').textContent=`DESTRUÍDOS: ${wrecks} · POS: ${posRank}º/6 · RECORDE: ${highScore.toLocaleString()}`;

  const badges=(S.eb>0.2?'<span class="hb-tag">FREIO DE MÃO</span>':'')+(S.burnout?'<span class="bo-tag">BURNOUT</span>':'');
  $('hTitle').innerHTML=`${c.n} · ${c.dr==='R'?'Tração Traseira':'Tração Dianteira'}${badges}`;
  $('hSpd').textContent=`${Math.round(Math.abs(S.u)*3.6)} km/h`;
  $('rpmBar').style.width=`${Math.round(S.rpm/c.rm*100)}%`;
  $('hGear').textContent=`Marcha ${S.gear+1} · ${Math.round(S.rpm)} RPM · Nitro (O) ${Math.round(nitro*100)}%`;
  $('nitroBar').style.width=`${Math.round(nitro*100)}%`;
  $('hHp').textContent=`Integridade: ${Math.round(playerHp)}%`;
  $('hpBar').style.width=`${Math.round(playerHp)}%`;
  $('hLap').textContent=`Volta ${Math.min(lap,LAPS)}/${LAPS} · ${mode==='race'?fmt(performance.now()/1000-tv):'0:00.00'} · Melhor ${best?fmt(best):'--'}`;
  $('hTel').textContent=`G Lat: ${(S.ay/G).toFixed(2)}g · Drift: ${Math.round(Math.abs(S.slipAng)/DEG)}° · ${S.sf<1?'Zebra/Terra':'Asfalto'}`;

  const b=getMapBounds(),kMap=Math.min(130/(b.bx1-b.bx0||1),100/(b.bz1-b.bz0||1));
  const mp=p=>[10+(p.x-b.bx0)*kMap,10+(p.z-b.bz0)*kMap];
  mc.clearRect(0,0,150,120);mc.strokeStyle='#cfd3d8';mc.lineWidth=4;mc.beginPath();
  pts.forEach((p,i)=>{const[x,y]=mp(p);i?mc.lineTo(x,y):mc.moveTo(x,y)});mc.closePath();mc.stroke();
  rivals.forEach((rv,k)=>{
    if(rv.wrecked)return;
    const[rx,ry]=mp({x:rv.x,z:rv.z});mc.fillStyle='#'+AI_COLORS[k].toString(16).padStart(6,'0');
    mc.beginPath();mc.arc(rx,ry,3.2,0,7);mc.fill();
  });
  const[cx,cy]=mp({x:S.x,z:S.z});mc.fillStyle='#ffffff';mc.beginPath();mc.arc(cx,cy,4.8,0,7);mc.fill();

  ren.render(sc,cam);
}

let last=performance.now(),acc=0;
function loop(t){
  requestAnimationFrame(loop);
  let dt=Math.min(.05,(t-last)/1000);last=t;
  if(slowMo>0){slowMo-=dt;dt*=0.35}
  if(!paused){
    acc+=dt;
    while(acc>=1/240){world();phys(1/240);acc-=1/240}
    updateRivals(dt);
    updateDriftAndFX(dt);
    updateParticles(dt);
  }
  render(dt,t);
}

buildTrack(0);
pick(0);
spawnRivals();
menu('<b>WASD / Setas:</b> Pilotar · <b>W + S (ou Espaço):</b> Burnout<br><b>O:</b> Nitro · <b>Q / E:</b> Câmera Lateral · <b>C:</b> Câmera · <b>T:</b> Setup','Largar');
requestAnimationFrame(loop);
</script>
