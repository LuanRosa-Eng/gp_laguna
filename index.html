<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP Laguna</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f4f0;--panel:rgba(12,16,22,.84);--red:#e63b2e;--gold:#ffbe0b;--cyan:#00e5ff;color-scheme:dark}
html,body{height:100%;margin:0;background:#1a2634;overflow:hidden;font:500 14px Barlow,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{position:fixed;background:var(--panel);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#hud{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);line-height:1.25;min-width:215px}
#hud b{font:800 32px/1 'Saira Condensed',sans-serif;display:block;letter-spacing:.5px}
#hud small{opacity:.82;display:block;font-size:12.5px}
.bar-wrap{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin:6px 0 4px}
#nitroBar{height:100%;width:100%;background:linear-gradient(90deg,#00b4d8,#00f5d4);transition:width .06s}
#rpmBar{height:100%;width:20%;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}

#scoreBox{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);text-align:center;min-width:220px;padding:8px 18px}
#pts{font:800 30px/1 'Saira Condensed',sans-serif;color:var(--gold);display:block}
#subPts{font:700 13px Barlow,sans-serif;letter-spacing:.6px;text-transform:uppercase;opacity:.9}
#driftLive{font:800 22px/1.1 'Saira Condensed',sans-serif;color:var(--cyan);margin-top:4px;min-height:24px;text-shadow:0 0 12px rgba(0,229,255,.5)}

#mm{right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:4px}
#set{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:275px;display:none;max-height:68vh;overflow-y:auto;z-index:15}
#set label{display:grid;grid-template-columns:1fr 54px;font-size:12.5px;margin:6px 0 0}
#set input{grid-column:1/3;width:100%;accent-color:var(--red)}
#flipBtn{width:100%;margin-top:10px;padding:6px 10px;font-size:15px;background:rgba(255,255,255,.15)}

#msg{position:fixed;left:0;right:0;top:22%;text-align:center;font:800 min(20vmin,130px)/1 'Saira Condensed',sans-serif;text-shadow:0 6px 24px rgba(0,0,0,.75);pointer-events:none;z-index:12;letter-spacing:1px}
#msgSub{position:fixed;left:0;right:0;top:37%;text-align:center;font:800 min(6vmin,36px)/1 'Saira Condensed',sans-serif;color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.8);pointer-events:none;z-index:12}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,18,.6);backdrop-filter:blur(6px);z-index:25}
#ov .p{position:static;max-width:440px;text-align:center;padding:24px 28px}
#ov h1{margin:0 0 6px;font:800 46px/1 'Saira Condensed',sans-serif;color:var(--red);text-transform:uppercase}
#ov p{margin:6px 0 14px;font-size:14.5px;line-height:1.45;opacity:.92}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
button{font:800 18px 'Saira Condensed',sans-serif;background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 20px;cursor:pointer;transition:transform .1s,filter .15s;letter-spacing:.5px}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.96)}
.row button{background:rgba(255,255,255,.14);padding:6px 13px}.row button.sel{background:var(--red)}
.glb-btn{display:inline-block;margin:6px 0 12px;padding:6px 14px;font:600 14px 'Saira Condensed',sans-serif;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.35);border-radius:8px;cursor:pointer}
#bt{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;z-index:15}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11;transition:opacity .12s}
</style>
</head>
<body>

  <button id="bm">Menu</button>
</div>
<div id="ov"></div>
<input type="file" id="glbInput" accept=".glb,.gltf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
const $=id=>document.getElementById(id),G=9.81,RHO=1.225,W=15,LT=3602,LAPS=3,DEG=Math.PI/180,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0');

/* =====================================================================
   1. CONFIGURAÇÕES DE ENGENHARIA E MODELOS 3D DO REPOSITÓRIO
   ===================================================================== */
const CARS=[
{n:'VW Saveiro',glb:'./volkswagen_saveiro.glb',rotY:0,c:0xf4f4f2,m:1120,L:2.75,t:[1.52,1.50],wf:.60,hcg:.51,r:.32,ww:.23,mu:1.40,cz:.25,cd:.82,ab:.5,dr:'F',br:.68,
 T:[[1500,220],[3000,320],[4800,350],[6200,310],[7000,260]],rm:7000,g:[3.5,2.1,1.5,1.15,.92,.75],fd:3.85,
 s:{kf:36,kr:32,h:110,cf:-1.2,cr:-1.2,tf:0,tr:.1,z:.45,ws:1.0},
 parts:[[1.78,.48,4.35,0,.48,0,0],[1.56,.46,1.65,0,.94,.35,1],[1.5,.05,1.5,0,1.20,.32,0]]},

{n:'BMW M3 E36',glb:'./1997_bmw_m3_e36.glb',rotY:0,c:0x1f56c4,m:1380,L:2.70,t:[1.54,1.56],wf:.50,hcg:.45,r:.33,ww:.26,mu:1.68,cz:1.1,cd:.78,ab:.45,dr:'R',br:.60,
 T:[[2000,285],[3800,355],[5500,375],[7200,345],[7800,305]],rm:7800,g:[3.5,2.25,1.65,1.3,1.05,.85],fd:3.62,
 s:{kf:75,kr:70,h:90,cf:-2.4,cr:-1.8,tf:.1,tr:.15,z:.55,ws:1.0},
 parts:[[1.82,.44,4.45,0,.44,0,0],[1.52,.38,1.9,0,.84,-.2,1],[1.44,.05,1.5,0,1.05,-.22,0]]},

{n:'BMW M5 E34',glb:'./1995_bmw_m5_e34.glb',rotY:0,c:0x2b2d32,m:1620,L:2.76,t:[1.56,1.58],wf:.51,hcg:.48,r:.34,ww:.27,mu:1.60,cz:.95,cd:.80,ab:.46,dr:'R',br:.60,
 T:[[1800,330],[3500,400],[4800,425],[6500,390],[7200,350]],rm:7200,g:[3.4,2.2,1.6,1.25,1.0,.82],fd:3.73,
 s:{kf:68,kr:64,h:95,cf:-2.0,cr:-1.6,tf:.1,tr:.15,z:.52,ws:1.0},
 parts:[[1.86,.46,4.72,0,.46,0,0],[1.56,.40,2.05,0,.88,-.22,1],[1.48,.05,1.65,0,1.10,-.24,0]]},

{n:'Dodge Viper ACR',glb:'./2016_dodge_viper_acr.glb',rotY:0,c:0xd9141e,m:1520,L:2.51,t:[1.68,1.72],wf:.49,hcg:.41,r:.36,ww:.35,mu:1.95,cz:3.2,cd:.92,ab:.40,dr:'R',br:.58,
 T:[[1500,580],[3000,740],[4950,813],[6000,760],[6600,680]],rm:6600,g:[2.66,1.78,1.30,1.00,.80,.68],fd:3.55,
 s:{kf:125,kr:130,h:75,cf:-3.2,cr:-2.5,tf:.1,tr:.2,z:.62,ws:1.0},
 parts:[[1.96,.38,4.48,0,.38,0,0],[1.56,.32,1.75,0,.74,-.25,1],[1.86,.05,.42,0,1.04,-2.15,2]]}
];

/* Traçado Laguna Seca (3,602 km com elevação e Saca-Rolhas) */
const P0=[[0,0,0],[150,0,2],[300,0,6],[410,15,12],[470,55,14],[480,110,15],[440,140,14],[370,135,12],[320,150,12],[310,200,14],[340,235,18],[395,245,22],[435,285,28],[430,345,38],[385,390,46],[310,405,52],[230,395,52],[160,365,50],[60,330,48],[-30,270,47],[-70,210,46],[-85,170,34],[-95,120,28],[-110,60,24],[-120,-40,18],[-120,-120,12],[-100,-190,9],[-40,-215,6],[-10,-195,5],[-20,-130,4],[-25,-60,2],[-18,-18,1]];

/* =====================================================================
   2. RENDERIZADOR PBR, CÉU ATMOSFÉRICO E TEXTURAS PROCEDURAIS
   ===================================================================== */
const ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.toneMapping=THREE.ACESFilmicToneMapping;
ren.toneMappingExposure=1.08;

const sc=new THREE.Scene();
sc.background=new THREE.Color(0x74b9e8);
sc.fog=new THREE.FogExp2(0x8ec5e8,0.00085);

{
  const pmrem=new THREE.PMREMGenerator(ren);
  const envSc=new THREE.Scene();
  envSc.background=new THREE.Color(0x9bd2f5);
  const eg=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0x3f662e}));
  eg.rotation.x=-Math.PI/2;eg.position.y=-3;envSc.add(eg);
  const es=new THREE.Mesh(new THREE.SphereGeometry(8,8,8),new THREE.MeshBasicMaterial({color:0xfff6d6}));
  es.position.set(25,35,15);envSc.add(es);
  sc.environment=pmrem.fromScene(envSc).texture;
}

const cam=new THREE.PerspectiveCamera(65,1,.3,3200);
sc.add(new THREE.HemisphereLight(0xdcecff,0x4a6b3a,.9));
const sun=new THREE.DirectionalLight(0xfff0d0,1.25);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
{const q=sun.shadow.camera;q.left=q.bottom=-55;q.right=q.top=55;q.near=1;q.far=320}
sc.add(sun,sun.target);

{
  const skyCv=document.createElement('canvas');skyCv.width=16;skyCv.height=256;
  const sx=skyCv.getContext('2d'),grd=sx.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#1d4e89');grd.addColorStop(0.45,'#5fa8d3');grd.addColorStop(0.55,'#cae9ff');grd.addColorStop(1,'#3a5a40');
  sx.fillStyle=grd;sx.fillRect(0,0,16,256);
  const skyDome=new THREE.Mesh(new THREE.SphereGeometry(2600,24,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(skyCv),side:THREE.BackSide,fog:false}));
  sc.add(skyDome);
}

function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

function makeAsphaltTex(){
  const cv=document.createElement('canvas');cv.width=256;cv.height=256;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#2a2d32';ctx.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){
    const v=32+Math.floor(Math.random()*28);
    ctx.fillStyle=`rgb(${v},${v},${v+3})`;
    ctx.fillRect(Math.random()*256,Math.random()*256,2,2);
  }
  const g=ctx.createLinearGradient(0,0,256,0);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.28,'rgba(10,10,12,0.22)');
  g.addColorStop(0.5,'rgba(0,0,0,0.05)');g.addColorStop(0.72,'rgba(10,10,12,0.22)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
  const tex=new THREE.CanvasTexture(cv);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.anisotropy=8;
  return tex;
}
const asphaltTex=makeAsphaltTex();

/* =====================================================================
   3. CONSTRUÇÃO DA PISTA 3D
   ===================================================================== */
const pts=[],tg=[],nr=[];
{
  const P=P0.map(p=>new THREE.Vector3(p[0],p[2],-p[1])),n=P.length,cr=(a,b,c,d,t)=>.5*(2*b+(c-a)*t+(2*a-5*b+4*c-d)*t*t+(3*b-a-3*c+d)*t*t*t);
  for(let i=0;i<n;i++){const a=P[(i+n-1)%n],b=P[i],c=P[(i+1)%n],d=P[(i+2)%n];for(let s=0;s<14;s++){const t=s/14;pts.push(new THREE.Vector3(cr(a.x,b.x,c.x,d.x,t),cr(a.y,b.y,c.y,d.y,t),cr(a.z,b.z,c.z,d.z,t)))}}
  let L=0;const m=pts.length;for(let i=0;i<m;i++)L+=Math.hypot(pts[(i+1)%m].x-pts[i].x,pts[(i+1)%m].z-pts[i].z);
  const k=LT/L;pts.forEach(p=>{p.x*=k;p.z*=k});
  for(let i=0;i<m;i++){const t=new THREE.Vector3(pts[(i+1)%m].x-pts[(i+m-1)%m].x,0,pts[(i+1)%m].z-pts[(i+m-1)%m].z).normalize();tg.push(t);nr.push(new THREE.Vector3(-t.z,0,t.x))}
}
const NP=pts.length;

function strip(pos,col,uv,o1,o2,y,f){
  for(let i=0;i<NP;i++){
    const j=(i+1)%NP,k=f(i),A=pts[i],B=pts[j],a=nr[i],b=nr[j];
    const v=[[A.x+a.x*o1,A.y+y,A.z+a.z*o1],[A.x+a.x*o2,A.y+y,A.z+a.z*o2],[B.x+b.x*o1,B.y+y,B.z+b.z*o1],[B.x+b.x*o2,B.y+y,B.z+b.z*o2]];
    const uvs=[[0,i*.6],[1,i*.6],[0,(i+1)*.6],[1,(i+1)*.6]];
    for(const q of [0,1,2,1,3,2]){pos.push(...v[q]);col.push(k.r,k.g,k.b);uv.push(...uvs[q])}
  }
}
function talude(pos,col,uv,sd){
  const gc=new THREE.Color(.28,.44,.2);
  for(let i=0;i<NP;i++){
    const j=(i+1)%NP,q=[];
    for(const s of [i,j]){const A=pts[s],o=sd*(W/2+11),e=sd*(W/2+11+(A.y+15)*1.3);q.push([A.x+nr[s].x*o,A.y,A.z+nr[s].z*o],[A.x+nr[s].x*e,-15,A.z+nr[s].z*e])}
    for(const k of [0,1,2,1,3,2]){pos.push(...q[k]);col.push(gc.r,gc.g,gc.b);uv.push(0,0)}
  }
}
{
  const pos=[],col=[],uv=[],h=W/2,C=(r,g,b)=>new THREE.Color(r,g,b);
  strip(pos,col,uv,-h,h,0,i=>C(.92,.92,.95));
  const gRoad=new THREE.BufferGeometry();
  gRoad.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  gRoad.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  gRoad.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  gRoad.computeVertexNormals();
  const mRoad=new THREE.Mesh(gRoad,new THREE.MeshStandardMaterial({map:asphaltTex,vertexColors:true,roughness:.82,metalness:.05}));
  mRoad.receiveShadow=true;sc.add(mRoad);

  const p2=[],c2=[],u2=[];
  for(const sd of [-1,1]){
    strip(p2,c2,u2,sd*(h-.5),sd*(h-.2),.02,()=>C(.95,.95,.95));
    strip(p2,c2,u2,sd*h,sd*(h+1.25),.03,i=>(i>>1)%2?C(.95,.95,.95):C(.88,.14,.12));
    strip(p2,c2,u2,sd*(h+1.25),sd*(h+11),-.02,()=>C(.36,.52,.24));
    talude(p2,c2,u2,sd);
  }
  const gEdge=new THREE.BufferGeometry();
  gEdge.setAttribute('position',new THREE.Float32BufferAttribute(p2,3));
  gEdge.setAttribute('color',new THREE.Float32BufferAttribute(c2,3));
  gEdge.setAttribute('uv',new THREE.Float32BufferAttribute(u2,2));
  gEdge.computeVertexNormals();
  const mEdge=new THREE.Mesh(gEdge,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));
  mEdge.receiveShadow=true;sc.add(mEdge);

  const gr=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),new THREE.MeshLambertMaterial({color:0x467232}));
  gr.rotation.x=-Math.PI/2;gr.position.y=-15.05;sc.add(gr);

  const rm=new THREE.MeshStandardMaterial({color:0xd9261c,roughness:.4}),gg=new THREE.Group();
  gg.position.copy(pts[0]);gg.rotation.y=Math.atan2(tg[0].x,tg[0].z);sc.add(gg);
  for(const p of [[-h-1.5,3.5,.5,7],[h+1.5,3.5,.5,7],[0,7.3,W+4,1]]){
    const b=new THREE.Mesh(new THREE.BoxGeometry(p[2],p[3],.6),rm);b.position.set(p[0],p[1],0);b.castShadow=true;gg.add(b);
  }
  const N=850,tr=new THREE.InstancedMesh(new THREE.ConeGeometry(2.5,7.2,7),new THREE.MeshLambertMaterial({color:0x2b6836}),N),
        tk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.45,2.4,6),new THREE.MeshLambertMaterial({color:0x6b4a2f}),N),d=new THREE.Object3D();
  let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let k=0;k<N;k++){
    const i=Math.floor(rnd()*NP),s=rnd()<.5?-1:1,o=h+14+rnd()*26,y=pts[i].y-(o-11)/1.3,z=.8+rnd()*.9;
    d.position.set(pts[i].x+nr[i].x*s*o,y+1.2,pts[i].z+nr[i].z*s*o);d.scale.setScalar(z);d.updateMatrix();tk.setMatrixAt(k,d.matrix);
    d.position.y=y+2.4+3.5*z;d.updateMatrix();tr.setMatrixAt(k,d.matrix);
  }
  sc.add(tr,tk);
}

function surf(x,z,h){
  let bi=0,bd=1e12;const lo=h<0?0:h-35,hi=h<0?NP:h+35;
  for(let j=lo;j<hi;j++){const i=(j+NP)%NP,dx=pts[i].x-x,dz=pts[i].z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}
  let best=null;
  for(const i of [(bi+NP-1)%NP,bi]){
    const a=pts[i],b=pts[(i+1)%NP],ex=b.x-a.x,ez=b.z-a.z,t=cl(((x-a.x)*ex+(z-a.z)*ez)/(ex*ex+ez*ez),0,1),
          px=a.x+ex*t,pz=a.z+ez*t,d=Math.hypot(x-px,z-pz);
    if(!best||d<best.d)best={d,i,y:a.y+(b.y-a.y)*t,s:(x-px)*nr[i].x+(z-pz)*nr[i].z};
  }
  return best;
}

/* =====================================================================
   4. MARCAS DE PNEU E PARTÍCULAS
   ===================================================================== */
const MAX_SKIDS=700;
const skidGeo=new THREE.BufferGeometry();
const skidPos=new Float32Array(MAX_SKIDS*18);
skidGeo.setAttribute('position',new THREE.BufferAttribute(skidPos,3));
const skidMesh=new THREE.Mesh(skidGeo,new THREE.MeshBasicMaterial({color:0x0b0c0e,transparent:true,opacity:0.48,side:THREE.DoubleSide,depthWrite:false}));
skidMesh.frustumCulled=false;
sc.add(skidMesh);
let skidPtr=0;
function addSkid(x1,y1,z1,x2,y2,z2,w=0.26){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  if(len<0.05||len>4)return;
  const nx=-dz/len*(w/2),nz=dx/len*(w/2),o=skidPtr*18;
  const p=[[x1-nx,y1+.03,z1-nz],[x1+nx,y1+.03,z1+nz],[x2-nx,y2+.03,z2-nz],[x2+nx,y2+.03,z2+nz]];
  [0,1,2,1,3,2].forEach((idx,k)=>{skidPos[o+k*3]=p[idx][0];skidPos[o+k*3+1]=p[idx][1];skidPos[o+k*3+2]=p[idx][2]});
  skidPtr=(skidPtr+1)%MAX_SKIDS;
  skidGeo.attributes.position.needsUpdate=true;
}

const particles=[];
const pGeo=new THREE.BoxGeometry(1,1,1);
function spawnParticle(x,y,z,vx,vy,vz,col,size,life,grav=0){
  let p=particles.find(o=>!o.act);
  if(!p){
    if(particles.length>260)return;
    const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1}));
    sc.add(m);p={m,act:false};particles.push(p);
  }
  p.act=true;p.m.visible=true;p.m.position.set(x,y,z);
  p.m.material.color.setHex(col);p.m.material.opacity=0.95;
  p.m.scale.setScalar(size);
  p.vx=vx;p.vy=vy;p.vz=vz;p.life=p.max=life;p.grav=grav;p.sz=size;
}
function updateParticles(dt){
  for(const p of particles){
    if(!p.act)continue;
    p.life-=dt;
    if(p.life<=0){p.act=false;p.m.visible=false;continue}
    p.vy-=p.grav*dt;
    p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    const r=p.life/p.max;
    p.m.material.opacity=r*0.9;
    if(p.grav===0)p.m.scale.setScalar(p.sz*(1+(1-r)*2.2));
  }
}

   5. MODELOS 3D REALISTAS (.GLB) + AJUSTE DE RODAS E RIVAIS

const dracoLoader=new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');
const gltfLoader=new THREE.GLTFLoader();gltfLoader.setDRACOLoader(dracoLoader);
const gltfCache={},gltfPending={};

function applyGLBToCar(vis,gltf,carDef,rotY=0){
  while(vis.body.children.length)vis.body.remove(vis.body.children[0]);
  /* Esconde as rodas cilíndricas provisórias para não sobrepor as rodas do modelo 3D */
  vis.wh.forEach(w=>w.gw.visible=false);
  vis.glbWheels=[];

  const root=gltf.scene.clone(true);
  const holder=new THREE.Group();
  root.rotation.y=rotY;
  holder.add(root);

  /* Escala proporcional ao comprimento real do carro */
  const b0=new THREE.Box3().setFromObject(holder);
  const sz=b0.getSize(new THREE.Vector3());
  const maxDim=Math.max(sz.x,sz.y,sz.z)||1;
  holder.scale.setScalar((carDef.L*1.6)/maxDim);

  /* Centraliza em X/Z e apoia os pneus exatamente no nível do asfalto (Y=0) */
  const b1=new THREE.Box3().setFromObject(holder);
  const cen=b1.getCenter(new THREE.Vector3());
  holder.position.set(-cen.x,-b1.min.y,-cen.z);

  holder.traverse(child=>{
    if(child.isMesh){
      child.castShadow=true;
      child.receiveShadow=true;
    }
    const nm=child.name.toLowerCase();
    if(nm.includes('wheel')||nm.includes('roda')||nm.includes('tire')||nm.includes('pneu')){
      if(!vis.glbWheels.includes(child))vis.glbWheels.push(child);
    }
  });

  vis.body.add(holder);
  vis.holder=holder;
  vis.hasGLB=true;
}

function loadCarGLB(vis,carDef){
  if(!carDef.glb)return;
  if(gltfCache[carDef.glb]){
    applyGLBToCar(vis,gltfCache[carDef.glb],carDef,carDef.rotY||0);
    return;
  }
  if(gltfPending[carDef.glb]){
    gltfPending[carDef.glb].push({vis,carDef});
    return;
  }
  gltfPending[carDef.glb]=[{vis,carDef}];
  gltfLoader.load(carDef.glb,gltf=>{
    gltfCache[carDef.glb]=gltf;
    const list=gltfPending[carDef.glb]||[];
    delete gltfPending[carDef.glb];
    list.forEach(item=>applyGLBToCar(item.vis,gltf,item.carDef,item.carDef.rotY||0));
  },undefined,()=>{delete gltfPending[carDef.glb]});
}

function mk(c,overrideColor){
  const g=new THREE.Group(),body=new THREE.Group();g.rotation.order='YXZ';g.add(body);
  const paintCol=overrideColor!==undefined?overrideColor:c.c;
  const M=[
    new THREE.MeshPhysicalMaterial({color:paintCol,metalness:.55,roughness:.22,clearcoat:1.0,clearcoatRoughness:.08}),
    new THREE.MeshPhysicalMaterial({color:0x0b1118,metalness:.2,roughness:.06,transmission:.45,transparent:true,opacity:.82}),
    new THREE.MeshStandardMaterial({color:0x141619,roughness:.65,metalness:.2}),
    new THREE.MeshStandardMaterial({color:0xd8dce0,metalness:.92,roughness:.15})
  ];
  c.parts.forEach(p=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(p[0],p[1],p[2]),M[p[6]]);
    m.position.set(p[3],p[4],p[5]);m.castShadow=true;m.receiveShadow=true;body.add(m);
  });
  const fZ=c.L*0.48,rZ=-c.L*0.48,wX=c.t[0]*0.38;
  const hlMat=new THREE.MeshBasicMaterial({color:0xfff8d6});
  const blMat=new THREE.MeshBasicMaterial({color:0x7a0808});
  [-1,1].forEach(sd=>{
    const hl=new THREE.Mesh(new THREE.BoxGeometry(.34,.12,.06),hlMat);hl.position.set(sd*wX,.45,fZ);body.add(hl);
    const bl=new THREE.Mesh(new THREE.BoxGeometry(.38,.14,.06),blMat);bl.position.set(sd*wX,.52,rZ);body.add(bl);
  });
  const flames=[-0.35,0.35].map(x=>{
    const f=new THREE.Mesh(new THREE.ConeGeometry(.11,.75,8),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.9}));
    f.rotation.x=-Math.PI/2;f.position.set(x,.32,rZ-.35);f.visible=false;g.add(f);return f;
  });
  const wh=[],a=c.L*(1-c.wf),b=c.L*c.wf;
  for(let w=0;w<4;w++){
    const fr=w<2,sd=w%2?-1:1,gw=new THREE.Group(),cy=new THREE.CylinderGeometry(c.r,c.r,c.ww,28);cy.rotateZ(Math.PI/2);
    const sp=new THREE.Mesh(cy,M[2]);sp.castShadow=true;
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(c.r*.68,c.r*.68,c.ww+.02,18),M[3]);rim.rotation.z=Math.PI/2;sp.add(rim);
    sp.add(new THREE.Mesh(new THREE.BoxGeometry(c.ww+.03,c.r*1.25,.05),M[2]));
    gw.add(sp);gw.position.set(sd*c.t[fr?0:1]/2,c.r,fr?a:-b);g.add(gw);wh.push({gw,sp,fr,sd});
  }
  const vis={g,body,wh,glbWheels:[],hasGLB:false,holder:null,blMat,flames,paintMat:M[0]};
  loadCarGLB(vis,c);
  return vis;
}

let au=null,engOsc=null,engSub=null,engFilter=null,engGain=null,screechGain=null,audioOn=true;
function initAudio(){
  if(au)return;
  try{
    au=new(window.AudioContext||window.webkitAudioContext)();
    engOsc=au.createOscillator();engOsc.type='sawtooth';
    engSub=au.createOscillator();engSub.type='triangle';
    engFilter=au.createBiquadFilter();engFilter.type='lowpass';engFilter.frequency.value=400;
    engGain=au.createGain();engGain.gain.value=0;
    engOsc.connect(engFilter);engSub.connect(engFilter);engFilter.connect(engGain);engGain.connect(au.destination);
    engOsc.start();engSub.start();

    const buf=au.createBuffer(1,au.sampleRate*2,au.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
    const noise=au.createBufferSource();noise.buffer=buf;noise.loop=true;
    const bp=au.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1150;bp.Q.value=6;
    screechGain=au.createGain();screechGain.gain.value=0;
    noise.connect(bp);bp.connect(screechGain);screechGain.connect(au.destination);
    noise.start();
  }catch(e){au=null}
}
function playCrashSound(heavy=false){
  if(!au||!audioOn)return;
  const t=au.currentTime,buf=au.createBuffer(1,au.sampleRate*(heavy?.9:.3),au.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(au.sampleRate*(heavy?.28:.08)));
  const src=au.createBufferSource();src.buffer=buf;
  const f=au.createBiquadFilter();f.type='lowpass';f.frequency.value=heavy?520:900;
  const g=au.createGain();g.gain.setValueAtTime(heavy?.45:.25,t);g.gain.exponentialRampToValueAtTime(.001,t+(heavy?.9:.3));
  src.connect(f);f.connect(g);g.connect(au.destination);src.start();
}

let car=CARS[0],U={},V=null,ST=null,mode='menu',lap=1,half=false,prevI=0,t0=0,tv=0,tot=0,paused=false,camMode=0;
let best=+(lsGet('gpBest')||0),highScore=+(lsGet('gpHighScore')||0);

function triggerWreck(rv,impactSpeed){
  rv.wrecked=true;rv.wreckTimer=4.5;rv.hp=0;
  wrecks++;
  const bonus=2500+Math.round(impactSpeed*20);
  score+=bonus;

  slowMo=0.65;
  shake=1.2;
  $('flash').style.opacity='0.65';
  setTimeout(()=>$('flash').style.opacity='0',110);
  playCrashSound(true);
  banner('RIVAL DESTRUÍDO!',`+${bonus} PTS · NITRO CHEIO`,1800);
  for(let i=0;i<45;i++){
    const ang=Math.random()*Math.PI*2,spd=4+Math.random()*18;
    spawnParticle(rv.x,rv.y+.7,rv.z,Math.cos(ang)*spd,5+Math.random()*12,Math.sin(ang)*spd,i%2?0xff5400:0xffbe0b,.35,1.1,16);
  }
}

function updateRivals(dt){
  const curTime=performance.now()/1000;
  for(const rv of rivals){
    if(rv.wrecked){
      rv.wreckTimer-=dt;
      rv.x+=rv.vx*dt;rv.z+=rv.vz*dt;rv.vx*=(1-2.5*dt);rv.vz*=(1-2.5*dt);
      rv.psi+=rv.spinVel*dt;rv.spinVel*=(1-1.5*dt);
      const s=surf(rv.x,rv.z,Math.floor(rv.p)%NP);
      rv.y=s.y;
      rv.vis.g.position.set(rv.x,rv.y,rv.z);
      rv.vis.g.rotation.set(0.18,rv.psi,0.35);
      if(Math.random()<0.6)spawnParticle(rv.x,rv.y+.8,rv.z,(Math.random()-.5)*2,3+Math.random()*3,(Math.random()-.5)*2,0x222222,.65,1.2,0);
      if(rv.wreckTimer<=0){
        rv.wrecked=false;rv.hp=rv.maxHp;rv.spinVel=0;rv.vx=rv.vz=0;
        const ahead=(ST.hint+24+rv.id*5)%NP;
        rv.p=(Math.floor(ST.hint/NP)*NP)+ahead;
        rv.x=pts[ahead].x+nr[ahead].x*rv.lane;
        rv.z=pts[ahead].z+nr[ahead].z*rv.lane;
        rv.y=pts[ahead].y;
        rv.psi=Math.atan2(tg[ahead].x,tg[ahead].z);
        rv.v=Math.max(35,ST.u*0.85);
      }
      continue;
    }

    const idx=((Math.floor(rv.p)%NP)+NP)%NP,nxt=(idx+1)%NP;
    const turn=Math.acos(cl(tg[idx].dot(tg[(idx+10)%NP]),-1,1));
    const playerProg=(lap-1)*NP+ST.hint;
    const gap=playerProg-rv.p;
    const catchup=cl(1+gap*0.004,0.82,1.22);
    const targetV=(66*rv.skill*catchup)*(1-Math.min(.48,turn*1.5));

    if(mode==='race'){
      rv.v+=cl(targetV-rv.v,-28*dt,22*dt);
      const segLen=Math.hypot(pts[nxt].x-pts[idx].x,pts[nxt].z-pts[idx].z)||1;
      rv.p+=(rv.v*dt)/segLen;
    }

    const i2=((Math.floor(rv.p)%NP)+NP)%NP,j2=(i2+1)%NP,f2=rv.p-Math.floor(rv.p);
    const off=rv.lane+Math.sin(rv.p*0.025+rv.id*2.1)*2.4;
    const tx=pts[i2].x+(pts[j2].x-pts[i2].x)*f2+nr[i2].x*off;
    const tz=pts[i2].z+(pts[j2].z-pts[i2].z)*f2+nr[i2].z*off;
    const ty=pts[i2].y+(pts[j2].y-pts[i2].y)*f2;
    const dx=tx-rv.x,dz=tz-rv.z;
    if(mode==='race'&&Math.hypot(dx,dz)>0.01)rv.psi=Math.atan2(dx,dz);
    rv.x=tx;rv.y=ty;rv.z=tz;

    rv.vis.g.position.set(rv.x,rv.y,rv.z);
    rv.vis.g.rotation.set(0,rv.psi,0);
    rv.vis.wh.forEach(w=>w.sp.rotation.x+=rv.v*dt/rv.c.r);
    rv.vis.glbWheels.forEach(w=>w.rotation.x+=rv.v*dt/rv.c.r);

    if(rv.hp<50&&Math.random()<0.35){
      spawnParticle(rv.x,rv.y+.7,rv.z,(Math.random()-.5)*1.5,2+Math.random()*2,(Math.random()-.5)*1.5,rv.hp<25?0xff4500:0x333333,.45,.8,0);
    }

    if(mode==='race'&&!rv.wrecked){
      const pSin=Math.sin(ST.psi),pCos=Math.cos(ST.psi);
      const rSin=Math.sin(rv.psi),rCos=Math.cos(rv.psi);
      const pPts=[[ST.x+pSin*1.1,ST.z+pCos*1.1],[ST.x-pSin*1.1,ST.z-pCos*1.1]];
      const rPts=[[rv.x+rSin*1.1,rv.z+rCos*1.1],[rv.x-rSin*1.1,rv.z-rCos*1.1]];

      let minD=99,bestP=null,bestR=null,hitRear=false;
      for(let a=0;a<2;a++)for(let b=0;b<2;b++){
        const d=Math.hypot(pPts[a][0]-rPts[b][0],pPts[a][1]-rPts[b][1]);
        if(d<minD){minD=d;bestP=pPts[a];bestR=rPts[b];hitRear=(b===1)}
      }
      const minSep=1.85;
      if(minD<minSep&&minD>0.001){
        const nx=(bestP[0]-bestR[0])/minD,nz=(bestP[1]-bestR[1])/minD,pen=minSep-minD;
        ST.x+=nx*pen*0.45;ST.z+=nz*pen*0.45;
        rv.lane+=((-nx*nr[i2].x-nz*nr[i2].z)*pen*1.6);
        rv.lane=cl(rv.lane,-W/2+1,W/2-1);

        const relV=Math.abs(ST.u-rv.v)+Math.abs(ST.v)*1.5+6;
        ST.u*=0.94;
        if(curTime-rv.lastHit>0.18){
          rv.lastHit=curTime;
          const boostBonus=K.boost&&nitro>0?1.8:1.0;
          const dmg=(relV*1.65+(hitRear?14:6))*boostBonus;
          rv.hp-=dmg;
          const hitPts=Math.round(dmg*12);
          score+=hitPts;
          if(score>highScore){highScore=score;lsSet('gpHighScore',highScore)}
          nitro=Math.min(1,nitro+0.12);
          shake=Math.min(0.65,relV*0.015);
          playCrashSound(false);

          const cx=(bestP[0]+bestR[0])/2,cz=(bestP[1]+bestR[1])/2;
          for(let s=0;s<14;s++){
            spawnParticle(cx,ST.y+.55,cz,(Math.random()-.5)*12,2+Math.random()*7,(Math.random()-.5)*12,0xffd166,.12,.45,18);
          }

          if(rv.hp<=0){
            rv.vx=-nx*22+rSin*rv.v*0.5;
            rv.vz=-nz*22+rCos*rv.v*0.5;
            rv.spinVel=(Math.random()<.5?1:-1)*9;
            triggerWreck(rv,relV);
          }else{
            banner('',`IMPACTO +${hitPts} PTS`,650);
          }
        }
      }
    }
  }
}

function world(){
  const S=ST,sp=Math.sin(S.psi),cp=Math.cos(S.psi),e=surf(S.x,S.z,S.hint),lim=W/2+13;
  S.hint=e.i;
  if(e.d>lim){
    const k=e.s-Math.sign(e.s)*lim;
    S.x-=nr[e.i].x*k;S.z-=nr[e.i].z*k;S.u*=.72;S.v*=.3;S.r*=.5;
    playCrashSound(false);
  }
  S.y=e.y;S.d=e.d;S.sf=e.d<W/2?1:e.d<W/2+1.4?1-.28*Math.min(1,(U.kf+U.kr)/400):.58;
  const f=surf(S.x+sp*car.L/2,S.z+cp*car.L/2,e.i).y,r=surf(S.x-sp*car.L/2,S.z-cp*car.L/2,e.i).y;
  S.slope=Math.atan2(f-r,car.L);

  const m=pts.length;
  if(e.i>m*.45&&e.i<m*.55)half=true;
  if(mode==='race'&&prevI>m*.9&&e.i<m*.1&&half){
    half=false;const n=performance.now()/1000,lt=n-tv;tv=n;
    if(!best||lt<best){best=lt;lsSet('gpBest',best)}
    if(lap>=LAPS){
      mode='done';tot=n-t0;
      const rank=1+rivals.filter(rv=>!rv.wrecked&&rv.p>(LAPS-1)*NP+S.hint).length;
      menu(`Posição: ${rank}º Lugar · Rivais destruídos: ${wrecks}<br>Pontuação Final: <b>${score.toLocaleString()} PTS</b><br>Tempo: ${fmt(tot)} · Melhor volta: ${fmt(best)}`,'Correr de Novo');
    }else{
      lap++;banner(`VOLTA ${lap}/${LAPS}`,`Tempo da volta: ${fmt(lt)}`,1400);
    }
  }
  prevI=e.i;
}

function phys(dt){
  const c=car,s=U,S=ST,m=c.m,L=c.L,b=c.wf*L,a=L-b,tf=c.t[0],tr=c.t[1];
  if(mode==='count'||mode==='menu'){S.u=S.v=S.r=S.slipAng=0;return}
  const go=mode==='race',kf=s.kf*1000,kr=s.kr*1000,Kf=kf*tf*tf/2,Kr=kr*tr*tr/2,rd=Kf/(Kf+Kr),
        hcg=c.hcg+(s.h-c.s.h)/1000,hh=Math.max(.05,hcg-.1),cz=c.cz*cl(1+(c.s.h-s.h)/1000*5,.6,1.6);
  const rev=go&&K.down&&S.u<=1;S.rd=rd;
  const boosting=go&&K.boost&&nitro>0.02&&S.u>5;
  if(boosting)nitro=Math.max(0,nitro-0.28*dt);
  else nitro=Math.min(1,nitro+0.03*dt);

  S.th+=((go&&K.up?1:0)-S.th)*Math.min(1,dt*9);
  S.bk+=(((go&&K.down&&S.u>1)||mode==='done'?1:0)-S.bk)*Math.min(1,dt*10);
  const si=go?(K.left?1:0)-(K.right?1:0):0;
  S.st+=(si-S.st)*Math.min(1,dt*(si?6:9));
  const u=S.u;S.del=S.st*.44/(1+.0015*u*u);

  const effR=c.r*(s.ws||1.0);
  const raw=Math.abs(u)/effR*c.g[S.gear]*c.fd*9.549;
  if(raw>c.rm*.96&&S.gear<c.g.length-1)S.gear++;else if(raw<c.rm*.5&&S.gear>0)S.gear--;
  S.rpm=Math.max(raw,c.rm*.3);let Tq=0;const T=c.T;
  for(let i=1;i<T.length;i++)if(S.rpm<=T[i][0]||i===T.length-1){Tq=T[i-1][1]+(T[i][1]-T[i-1][1])*cl((S.rpm-T[i-1][0])/(T[i][0]-T[i-1][0]),0,1);break}
  if(S.rpm>=c.rm)Tq=0;

  const boostMult=boosting?1.52:1.0;
  const Fd=(Tq*c.g[S.gear]*c.fd*.92/effR*S.th)*boostMult,Fr=Tq*c.g[0]*c.fd*.9/effR*.28;
  const df=.5*RHO*u*u*cz,lon=S.ax,lat=S.ay,dLon=m*lon*hcg/L,dF=m*lat*(b/L*.08/tf+hh*rd/tf),dR=m*lat*(a/L*.1/tr+hh*(1-rd)/tr);
  const AX=[m*G*b/L-dLon+df*c.ab,m*G*a/L+dLon+df*(1-c.ab)],roll=cl(m*lat*hh/(Kf+Kr-m*G*hh),-.15,.15);
  S.roll=roll;S.bp=cl(m*lon*hh/(2*kf*a*a+2*kr*b*b),-.08,.08);

  let Fx=0,Fy=0,Mz=0,FxT=0;
  for(let w=0;w<4;w++){
    const fr=w<2,sd=w%2?-1:1,xi=fr?a:-b,yi=sd*(fr?tf:tr)/2,Fz=Math.max(60,AX[fr?0:1]/2-sd*(fr?dF:dR));
    S.fz[w]=Fz;
    const cam_=(fr?s.cf:s.cr)+(sd*lat<0?1:-1)*.7*Math.abs(roll)/DEG,
          fc=1.045-.0045*Math.pow(cam_+3.2,2),
          Fm=c.mu*(1-.1*(Fz/(m*G/4)-1))*S.sf*Fz;
    const dw=(fr?S.del:0)-sd*(fr?s.tf:s.tr)*DEG,co=Math.cos(dw),sn=Math.sin(dw),
          vx=u-S.r*yi,vy=S.v+S.r*xi,vl=vx*co+vy*sn,vt=-vx*sn+vy*co;
    const fy=-Fm*fc*Math.sin(1.5*Math.atan(14*Math.atan2(vt,Math.abs(vl)+1.5))),drv=(c.dr==='R')!==fr;
    let cmd=0;
    if(rev&&drv)cmd=-Fr/2;else{if(drv)cmd+=Fd/2;cmd-=S.bk*3.5*m*G*(fr?c.br:1-c.br)/2*cl(vl/.6,-1,1)}
    const lim=Math.sqrt(Math.max(0,Math.pow(Fm*fc,2)-fy*fy)),fx=cl(cmd,-lim,lim),bx=fx*co-fy*sn,by=fx*sn+fy*co;
    Fx+=bx;Fy+=by;FxT+=bx;Mz+=xi*by-yi*bx;
  }
  Fx+=-.5*RHO*c.cd*u*Math.abs(u)-.012*m*G*cl(u,-1,1)-m*G*Math.sin(S.slope);
  S.u+=(Fx/m+S.v*S.r)*dt;S.v+=(Fy/m-u*S.r)*dt;S.r+=Mz/(m*1.52)*dt;
  if(Math.abs(S.u)<4){const k=1-Math.min(1,dt*(5-Math.abs(S.u))*2);S.v*=k;S.r*=k}
  const f=cl(dt*(8+10*s.z),0,1);S.ax+=(FxT/m-S.ax)*f;S.ay+=(Fy/m-S.ay)*f;
  S.psi+=S.r*dt;
  const sp=Math.sin(S.psi),cp=Math.cos(S.psi);
  S.x+=(S.u*sp+S.v*cp)*dt;S.z+=(S.u*cp-S.v*sp)*dt;
  S.slipAng=Math.abs(S.u)>6?Math.atan2(S.v,Math.abs(S.u)):0;
}

function updateDriftAndFX(dt){
  const S=ST,c=car,spdKmh=Math.abs(S.u)*3.6,degSlip=Math.abs(S.slipAng)/DEG;
  const isDrifting=mode==='race'&&spdKmh>36&&degSlip>10.5&&S.d<W/2+1.2;

  const sp=Math.sin(S.psi),cp=Math.cos(S.psi),b=c.wf*c.L,ht=c.t[1]/2;
  const rLx=S.x-sp*b-cp*ht,rLz=S.z-cp*b+sp*ht;
  const rRx=S.x-sp*b+cp*ht,rRz=S.z-cp*b-sp*ht;

  if(isDrifting){
    driftTimer=1.2;
    const rate=(degSlip*3.8+spdKmh*1.6)*dt;
    driftPts+=rate;
    driftMult=driftPts>1500?5:driftPts>700?3:driftPts>250?2:1;
    nitro=Math.min(1,nitro+0.16*dt);

    if(prevRearL){addSkid(prevRearL[0],S.y,prevRearL[1],rLx,S.y,rLz,c.ww);addSkid(prevRearR[0],S.y,prevRearR[1],rRx,S.y,rRz,c.ww)}
    if(Math.random()<0.75){
      spawnParticle(rLx,S.y+.15,rLz,(Math.random()-.5)*1.5,1.2+Math.random(),(Math.random()-.5)*1.5,0xeaeaea,.35,.55,0);
      spawnParticle(rRx,S.y+.15,rRz,(Math.random()-.5)*1.5,1.2+Math.random(),(Math.random()-.5)*1.5,0xeaeaea,.35,.55,0);
    }
    $('driftLive').textContent=`DRIFT ${Math.round(driftPts)} ×${driftMult}`;
  }else{
    if(driftTimer>0){
      driftTimer-=dt;
      if(driftTimer<=0&&driftPts>20){
        const banked=Math.round(driftPts*driftMult);
        score+=banked;
        if(score>highScore){highScore=score;lsSet('gpHighScore',highScore)}
        driftPts=0;driftMult=1;
        $('driftLive').textContent=`+${banked} PTS!`;
        setTimeout(()=>{if(driftPts===0)$('driftLive').textContent=''},900);
      }
    }
  }
  prevRearL=[rLx,rLz];prevRearR=[rRx,rRz];

  const boosting=mode==='race'&&K.boost&&nitro>0.02&&S.u>5;
  V.blMat.color.setHex(S.bk>0.1?0xff1e1e:0x660606);
  V.flames.forEach(fl=>{fl.visible=boosting;if(boosting)fl.scale.z=0.7+Math.random()*0.8});

  if(au&&audioOn){
    const rpmRatio=S.rpm/c.rm;
    engOsc.frequency.value=48+rpmRatio*195;
    engSub.frequency.value=24+rpmRatio*97.5;
    engFilter.frequency.value=260+S.th*950+rpmRatio*700;
    engGain.gain.value=(mode==='race'||mode==='count')?(0.045+S.th*0.045):0;
    screechGain.gain.value=isDrifting?cl((degSlip-10)/25,0,0.09):0;
  }else if(au){
    engGain.gain.value=0;screechGain.gain.value=0;
  }
}

/* =====================================================================
   10. INTERFACE, CONTROLES E LOOP PRINCIPAL
   ===================================================================== */
function menu(txt,btn){
  mode='menu';$('ov').style.display='flex';
  $('ov').innerHTML=`<div class="p"><h1>GP LAGUNA</h1><p>${txt}</p>
    <div class="row">${CARS.map((c,i)=>`<button data-i="${i}" class="${c===car?'sel':''}">${c.n}</button>`).join('')}</div>
    <label class="glb-btn" id="pickGlb">📂 Carregar Skin 3D (.glb / .gltf)</label><br>
    <button id="go">${btn}</button></div>`;
  $('pickGlb').onclick=()=>$('glbInput').click();
  $('ov').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{pick(+b.dataset.i);menu(txt,btn)});
  $('go').onclick=start;
}
function start(){
  initAudio();
  $('ov').style.display='none';
  score=0;wrecks=0;driftPts=0;driftMult=1;nitro=1.0;slowMo=0;
  place();spawnRivals();
  mode='count';let n=3;$('msg').textContent=n;$('msgSub').textContent='';
  const iv=setInterval(()=>{
    n--;
    if(n>0)$('msg').textContent=n;
    else{clearInterval(iv);$('msg').textContent='VAI!';mode='race';t0=tv=performance.now()/1000;setTimeout(()=>$('msg').textContent='',850)}
  },850);
}

const kmap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ShiftLeft:'boost',ShiftRight:'boost',Space:'boost'};
addEventListener('keydown',e=>{
  if(kmap[e.code]){K[kmap[e.code]]=1;e.preventDefault()}
  if(e.repeat)return;
  if(e.code==='KeyT')$('bs').click();
  if(e.code==='KeyC')camMode=(camMode+1)%3;
  if(e.code==='KeyM')$('ba').click();
  if(e.code==='KeyP'&&mode==='race'){paused=!paused;$('msg').textContent=paused?'PAUSA':''}
  if(e.code==='KeyR'&&mode==='race'){const i=surf(ST.x,ST.z,-1).i;Object.assign(ST,{x:pts[i].x,z:pts[i].z,psi:Math.atan2(tg[i].x,tg[i].z),u:0,v:0,r:0,hint:i})}
});
addEventListener('keyup',e=>{if(kmap[e.code])K[kmap[e.code]]=0});

$('ba').onclick=()=>{audioOn=!audioOn;$('ba').textContent='Som: '+(audioOn?'ON':'OFF')};
$('bs').onclick=()=>{const s=$('set');s.style.display=s.style.display==='block'?'none':'block'};
$('bm').onclick=()=>menu('Escolha seu carro e destrua os rivais!','Largar');

const mm=$('mm'),mc=mm.getContext('2d');let bx0=1e9,bx1=-1e9,bz0=1e9,bz1=-1e9;
pts.forEach(p=>{bx0=Math.min(bx0,p.x);bx1=Math.max(bx1,p.x);bz0=Math.min(bz0,p.z);bz1=Math.max(bz1,p.z)});
const mp=p=>{const k=Math.min(130/(bx1-bx0),100/(bz1-bz0));return[10+(p.x-bx0)*k,10+(p.z-bz0)*k]};

function render(dt,t){
  const S=ST,c=car,ws=U.ws||1.0;
  V.g.position.set(S.x,S.y,S.z);
  V.g.rotation.set(-S.slope-S.bp,S.psi,S.roll);
  V.body.position.y=(U.h-c.s.h)/1000-.02;

  V.wh.forEach(w=>{
    const toe=(w.fr?S.del:0)-w.sd*(w.fr?U.tf:U.tr)*DEG;
    w.gw.rotation.set(0,toe,-w.sd*(w.fr?U.cf:U.cr)*DEG);
    w.gw.scale.setScalar(ws);
    w.gw.position.y=c.r*ws;
    w.sp.rotation.x+=S.u*dt/(c.r*ws);
  });
  V.glbWheels.forEach(w=>{
    w.rotation.x+=S.u*dt/(c.r*ws);
  });

  sun.position.set(S.x+65,S.y+95,S.z+45);sun.target.position.set(S.x,S.y,S.z);

  const sp=Math.sin(S.psi),cp=Math.cos(S.psi);
  const shX=shake>0?(Math.random()-.5)*shake:0,shY=shake>0?(Math.random()-.5)*shake:0;
  shake=Math.max(0,shake-dt*2.4);

  if(mode==='menu'){
    const a=t*.00035;cam.position.set(S.x+Math.sin(a)*8.5,S.y+2.8,S.z+Math.cos(a)*8.5);cam.lookAt(S.x,S.y+.8,S.z);
  }else if(camMode===1){
    cam.position.set(S.x+sp*(c.L*.2)+shX,S.y+1.08+shY,S.z+cp*(c.L*.2));
    cam.lookAt(S.x+sp*30,S.y+1.0+S.slope*30,S.z+cp*30);
  }else{
    const distBack=camMode===2?11.5:8.2,heightUp=camMode===2?4.5:3.0;
    const k=1-Math.exp(-8*dt),tx=S.x-sp*distBack,tz=S.z-cp*distBack,ty=S.y+heightUp;
    cam.position.x+=(tx-cam.position.x)*k+shX;
    cam.position.z+=(tz-cam.position.z)*k;
    cam.position.y+=(ty-cam.position.y)*k+shY;
    cam.lookAt(S.x+sp*8,S.y+1.15,S.z+cp*8);
  }
  const boosting=mode==='race'&&K.boost&&nitro>0.02&&S.u>5;
  cam.fov=62+Math.min(24,Math.abs(S.u)*.22)+(boosting?7:0);
  cam.updateProjectionMatrix();

  const f=S.fz.map(v=>(v/1000).toFixed(1));
  const playerProg=(lap-1)*NP+S.hint;
  const posRank=1+rivals.filter(rv=>!rv.wrecked&&rv.p>playerProg).length;

  $('pts').textContent=`${score.toLocaleString()} PTS`;
  $('subPts').textContent=`DESTRUÍDOS: ${wrecks} · POS: ${posRank}º/6 · RECORDE: ${highScore.toLocaleString()}`;

  $('hud').innerHTML=`<small>${c.n} · ${c.dr==='R'?'Tração Traseira':'Tração Dianteira'}</small>
    <b>${Math.round(Math.abs(S.u)*3.6)} km/h</b>
    <div class="bar-wrap"><div id="rpmBar" style="width:${Math.round(S.rpm/c.rm*100)}%"></div></div>
    <small>Marcha ${S.gear+1} · ${Math.round(S.rpm)} RPM · Nitro ${Math.round(nitro*100)}%</small>
    <div class="bar-wrap"><div id="nitroBar" style="width:${Math.round(nitro*100)}%"></div></div>
    <small>Volta ${Math.min(lap,LAPS)}/${LAPS} · ${mode==='race'?fmt(performance.now()/1000-tv):'0:00.00'} · Melhor ${best?fmt(best):'--'}</small>
    <small>G Lat: ${(S.ay/G).toFixed(2)}g · Drift: ${Math.round(Math.abs(S.slipAng)/DEG)}° · ${S.sf<1?'Zebra/Terra':'Asfalto'}</small>
    <small>Cargas kN: FE ${f[0]} FD ${f[1]} TE ${f[2]} TD ${f[3]}</small>`;

  mc.clearRect(0,0,150,120);mc.strokeStyle='#cfd3d8';mc.lineWidth=4;mc.beginPath();
  pts.forEach((p,i)=>{const[x,y]=mp(p);i?mc.lineTo(x,y):mc.moveTo(x,y)});mc.closePath();mc.stroke();
  rivals.forEach((rv,k)=>{
    if(rv.wrecked)return;
    const[rx,ry]=mp({x:rv.x,z:rv.z});mc.fillStyle='#'+AI_COLORS[k].toString(16).padStart(6,'0');
    mc.beginPath();mc.arc(rx,ry,3.2,0,7);mc.fill();
  });
  const[cx,cy]=mp({x:S.x,z:S.z});mc.fillStyle='#ffffff';mc.beginPath();mc.arc(cx,cy,4.8,0,7);mc.fill();

  ren.render(sc,cam);
}

let last=performance.now(),acc=0;
function loop(t){
  requestAnimationFrame(loop);
  let dt=Math.min(.05,(t-last)/1000);last=t;
  if(slowMo>0){slowMo-=dt;dt*=0.32}
  if(!paused){
    acc+=dt;
    while(acc>=1/120){world();phys(1/120);acc-=1/120}
    updateRivals(dt);
    updateDriftAndFX(dt);
    updateParticles(dt);
  }
  render(dt,t);
}

pick(0);
spawnRivals();
menu('<b>WASD / Setas:</b> Pilotar · <b>Shift / Espaço:</b> Nitro<br><b>T:</b> Setup Mecânico · <b>C:</b> Câmera · <b>R:</b> Reset · <b>P:</b> Pausa<br>Derrape nas curvas para carregar Nitro e bata nos rivais para destruí-los!','Largar');
requestAnimationFrame(loop);
</script>
